openapi: 3.1.0

# Raíz del contrato. Deliberadamente corta: aquí solo está el mapa de rutas.
# Cada endpoint vive en rutas/ y cada esquema en componentes/, para que seguir
# uno no obligue a saltar entre dos zonas de un archivo de cientos de líneas.
#
# Los generadores no leen este archivo, leen openapi.bundled.yaml, que es el
# resultado de resolver estos $ref. Ver README.md.

info:
  title: API de reservas
  version: 0.1.0
  description: |
    Contrato único entre el backend en Go y el frontend en React. Los tipos de
    ambos lados se generan desde aquí, así que este archivo es la fuente de
    verdad: un cambio que rompa el contrato rompe la compilación de los dos, en
    vez de aparecer como un fallo en tiempo de ejecución.

    Cubre el catálogo, la disponibilidad y las reservas (RF-01, RF-02, RF-03,
    RF-06, RF-09, RF-26), y las cuentas con su acceso (RF-12, RF-13, RF-18,
    RF-19, RF-21, RF-22, RF-23, RF-24, RF-25). El resto de los RF se añaden a
    medida que se implementan.

servers:
  - url: http://localhost:8080
    description: Desarrollo local

tags:
  - name: catalogo
    description: Sedes y servicios (RF-26)
  - name: disponibilidad
    description: Consulta de horarios libres (RF-26)
  - name: reservas
    description: Creación y consulta de reservas (RF-01, RF-02, RF-03, RF-06)
  - name: sesiones
    description: |
      Identificación del cliente. Dos puertas distintas sobre la misma etiqueta:
      el código de un solo uso del invitado (RF-02) y el inicio de sesión de una
      cuenta con sus tokens y su lista de sesiones (RF-12, RF-25).
  - name: cuentas
    description: Alta, perfil, verificación, contraseña y preferencias (RF-18, RF-19, RF-21, RF-22, RF-24, RF-25)
  - name: agentes
    description: Intercambio de credencial por token de acciones (RF-13)

components:
  securitySchemes:
    TokenCliente:
      type: http
      scheme: bearer
      description: |
        Un solo encabezado para tres portadores distintos, porque RF-23 modela
        el alcance como una propiedad de la cuenta y no de la ruta:

        - **Invitado** (`POST /v1/sesiones/token`): acredita que quien lo
          presenta controla ese correo. Sin cuenta detrás y sin roles: su
          alcance son exactamente las reservas hechas con esa dirección (RF-02).
        - **Cuenta** (`POST /v1/sesiones/contrasena`, `.../enlace/canje`,
          `.../refresco`): su alcance sale del tipo de cuenta (RF-23). Un
          `usuario` ve lo suyo, un `administrador` ve su tenant entero (RF-32).
        - **Agente** (`POST /v1/agentes/token`): actúa en nombre de una cuenta,
          con el alcance ya intersecado al emitirlo (RF-13). Nunca recibe más
          del que ya tiene la cuenta impersonada.

        Todos son de vigencia corta y ninguno se comprueba contra la base al
        verificarlo: es lo que le permite sostener la ruta de lectura de RNF-03.
        Lo que sí se revoca es la SESIÓN (RF-25), y corta el refresco al
        instante; el de acceso muere al vencer. La ventana de revocación es, por
        tanto, exactamente su vigencia.

paths:
  /v1/sedes:
    $ref: './rutas/catalogo.yaml#/sedes'

  /v1/servicios:
    $ref: './rutas/catalogo.yaml#/servicios'

  /v1/disponibilidad:
    $ref: './rutas/disponibilidad.yaml#/disponibilidad'

  /v1/sesiones/codigo:
    $ref: './rutas/sesiones.yaml#/codigo'

  /v1/sesiones/token:
    $ref: './rutas/sesiones.yaml#/token'

  /v1/sesiones/contrasena:
    $ref: './rutas/sesiones.yaml#/contrasena'

  /v1/sesiones/enlace:
    $ref: './rutas/sesiones.yaml#/enlace'

  /v1/sesiones/enlace/canje:
    $ref: './rutas/sesiones.yaml#/canjeEnlace'

  /v1/sesiones/refresco:
    $ref: './rutas/sesiones.yaml#/refresco'

  /v1/sesiones:
    $ref: './rutas/sesiones.yaml#/coleccion'

  /v1/sesiones/{id}:
    $ref: './rutas/sesiones.yaml#/porId'

  /v1/cuentas:
    $ref: './rutas/cuentas.yaml#/coleccion'

  /v1/cuentas/yo:
    $ref: './rutas/cuentas.yaml#/propia'

  /v1/cuentas/yo/preferencias:
    $ref: './rutas/cuentas.yaml#/preferencias'

  /v1/cuentas/verificacion:
    $ref: './rutas/cuentas.yaml#/verificacion'

  /v1/cuentas/verificacion/canje:
    $ref: './rutas/cuentas.yaml#/canjeVerificacion'

  /v1/cuentas/yo/contrasena:
    $ref: './rutas/cuentas.yaml#/contrasenaPropia'

  /v1/cuentas/contrasena/restablecimiento:
    $ref: './rutas/cuentas.yaml#/restablecimiento'

  /v1/cuentas/contrasena/recuperacion:
    $ref: './rutas/cuentas.yaml#/recuperacion'

  /v1/agentes/token:
    $ref: './rutas/agentes.yaml#/token'

  /v1/reservas:
    $ref: './rutas/reservas.yaml#/coleccion'

  /v1/reservas/{id}:
    $ref: './rutas/reservas.yaml#/porId'

  /v1/reservas/{id}/cancelacion:
    $ref: './rutas/reservas.yaml#/cancelacion'
