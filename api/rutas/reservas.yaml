# Reservas: creación y consulta (RF-01, RF-02, RF-03, RF-09).

coleccion:
  get:
    operationId: listarReservas
    summary: Reservas de quien pide (RF-02, filtros de RF-09)
    description: |
      El alcance NO es fijo: sale de quién presenta el token (RF-23). Hoy solo
      existe el token de invitado, así que devuelve las reservas hechas con el
      correo que ese token acredita.

      Con un token de cuenta el alcance sale del tipo (RF-23): un `usuario` ve
      las suyas, un `administrador` ve las de su tenant (RF-32) y un agente, las
      de la cuenta que representa (RF-05). Es una operación con el alcance
      acotado por la cuenta, no cuatro rutas distintas por rol.

      Los filtros `sede_id` y `recurso_id` solo tienen sentido en el alcance del
      administrador —la agenda de RF-32 se recorre por sede y por recurso— pero
      no se rechazan a un `usuario`: acotar lo propio por sede es una consulta
      legítima, y prohibirla obligaría a que el filtro supiera de roles.
    tags: [reservas]
    security:
      - TokenCliente: []
    parameters:
      - $ref: '../componentes/parametros.yaml#/Tenant'
      - name: estado
        in: query
        required: false
        schema:
          type: array
          items:
            $ref: '../componentes/esquemas/reservas.yaml#/EstadoReserva'
        style: form
        explode: false
      - name: desde
        in: query
        required: false
        schema: { type: string, format: date-time }
      - name: hasta
        in: query
        required: false
        schema: { type: string, format: date-time }
      - name: sede_id
        in: query
        required: false
        description: Agenda de una sede (RF-32).
        schema: { type: string, format: uuid }
      - name: recurso_id
        in: query
        required: false
        description: Agenda de un recurso concreto (RF-32).
        schema: { type: string, format: uuid }
      - name: limite
        in: query
        required: false
        schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      - name: cursor
        in: query
        required: false
        description: |
          Cursor opaco de la página siguiente. Paginación por cursor y no por
          desplazamiento: con OFFSET, insertar una fila mientras se pagina
          desplaza el resto y el cliente ve duplicados o se salta filas.
        schema: { type: string }
    responses:
      '200':
        description: Página de reservas
        content:
          application/json:
            schema:
              $ref: '../componentes/esquemas/reservas.yaml#/ListaReservas'
      '400': { $ref: '../componentes/respuestas.yaml#/PeticionInvalida' }
      '401': { $ref: '../componentes/respuestas.yaml#/NoAutorizado' }
      '403': { $ref: '../componentes/respuestas.yaml#/FueraDeAlcance' }
      '500': { $ref: '../componentes/respuestas.yaml#/ErrorInterno' }

  post:
    operationId: crearReserva
    # Publica a proposito: RF-01 admite reservar como INVITADO, sin cuenta. Es
    # justo lo que crea la necesidad de RF-02, porque despues hay que poder
    # demostrar que uno es quien reservo.
    security: []
    summary: Crear una reserva (RF-01)
    description: |
      Ruta crítica de RNF-01: presupuesto de 200 ms. Devuelve una reserva
      **pendiente** con el cupo ya garantizado, sin esperar a que el pago se
      confirme. La confirmación llega después por el webhook de Stripe (RF-33),
      fuera de este presupuesto.

      La reserva pendiente caduca en `expira_en`. Si el pago no llega antes, un
      trabajador la marca expirada y libera el cupo (RF-27).
    tags: [reservas]
    parameters:
      - $ref: '../componentes/parametros.yaml#/Tenant'
      - name: Idempotency-Key
        in: header
        required: true
        description: |
          Clave única de la operación. Obligatoria, no opcional: un agente que
          reintenta un POST tras un timeout crearía dos bloqueos que nadie
          libera hasta el TTL. Repetir la misma clave devuelve la reserva ya
          creada en vez de crear otra.
        schema: { type: string, minLength: 8, maxLength: 128 }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../componentes/esquemas/reservas.yaml#/NuevaReserva'
    responses:
      '201':
        description: Reserva creada, pendiente de pago
        content:
          application/json:
            schema:
              $ref: '../componentes/esquemas/reservas.yaml#/ReservaCreada'
      '400': { $ref: '../componentes/respuestas.yaml#/PeticionInvalida' }
      '404': { $ref: '../componentes/respuestas.yaml#/NoEncontrado' }
      '409':
        description: |
          El horario ya está tomado. Es la respuesta al rechazo de la
          restricción EXCLUDE por otra transacción concurrente: no es un error
          del cliente ni del servidor, es el resultado normal de perder una
          carrera por el mismo cupo.
        content:
          application/problem+json:
            schema:
              $ref: '../componentes/esquemas/comunes.yaml#/Problema'
      '422': { $ref: '../componentes/respuestas.yaml#/NoProcesable' }
      '429': { $ref: '../componentes/respuestas.yaml#/DemasiadasPeticiones' }
      '500': { $ref: '../componentes/respuestas.yaml#/ErrorInterno' }

porId:
  get:
    operationId: obtenerReserva
    summary: Detalle de una reserva (RF-03)
    description: |
      Una reserva que existe pero es de otra persona responde `404`, no `403`.
      Un 403 confirmaría que esa reserva existe, y con identificadores ajenos
      eso permite comprobar cuáles son reales.
    tags: [reservas]
    security:
      - TokenCliente: []
    parameters:
      - $ref: '../componentes/parametros.yaml#/Tenant'
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      '200':
        description: La reserva
        content:
          application/json:
            schema:
              $ref: '../componentes/esquemas/reservas.yaml#/Reserva'
      '401': { $ref: '../componentes/respuestas.yaml#/NoAutorizado' }
      '404': { $ref: '../componentes/respuestas.yaml#/NoEncontrado' }
      '500': { $ref: '../componentes/respuestas.yaml#/ErrorInterno' }

cancelacion:
  post:
    operationId: cancelarReserva
    summary: Cancelar una reserva (RF-06)
    description: |
      Aplica la política que la reserva congeló al crearse, no la vigente hoy
      (RF-15). Es lo que impide que un negocio endurezca su política el martes y
      se la aplique a quien reservó el lunes bajo otras condiciones.

      Fuera del plazo de cancelación responde `422` con lo que faltaba, no un
      `403`: no es una cuestión de permisos, es que la regla del negocio no lo
      permite en ese momento.

      El reembolso NO ocurre aquí. Se dispara aparte (RF-29) y por eso la
      respuesta no dice nada del dinero: prometerlo en esta respuesta sería
      afirmar algo que este componente no puede garantizar.
    tags: [reservas]
    security:
      - TokenCliente: []
    parameters:
      - $ref: '../componentes/parametros.yaml#/Tenant'
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      '200':
        description: La reserva, ya cancelada
        content:
          application/json:
            schema:
              $ref: '../componentes/esquemas/reservas.yaml#/Reserva'
      '401': { $ref: '../componentes/respuestas.yaml#/NoAutorizado' }
      '404': { $ref: '../componentes/respuestas.yaml#/NoEncontrado' }
      '409':
        description: |
          La reserva ya no está en un estado que se pueda cancelar: ya estaba
          cancelada, ya se completó, o el bloqueo expiró solo.
        content:
          application/problem+json:
            schema:
              $ref: '../componentes/esquemas/comunes.yaml#/Problema'
      '422': { $ref: '../componentes/respuestas.yaml#/NoProcesable' }
      '500': { $ref: '../componentes/respuestas.yaml#/ErrorInterno' }
