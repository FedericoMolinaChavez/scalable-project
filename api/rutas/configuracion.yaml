# La configuración del negocio: RF-14, RF-15, RF-17, RF-30 y RF-31.
#
# Todo bajo `/v1/config`, separado del catálogo público de `/v1/sedes` y
# `/v1/servicios`. No es duplicación: son dos superficies con dos alcances y dos
# formas distintas. La pública devuelve solo lo ACTIVO —una sede inactiva no es
# una que se muestra en gris, es una que no debe poder elegirse— y no exige
# identificarse; esta devuelve todo, exige ser administrador del tenant, y es la
# única que escribe.
#
# Ninguna lleva `X-Tenant-Id`: el tenant sale del token (RF-23). Aceptarlo en
# una cabecera permitiría configurar el negocio de otro escribiendo su
# identificador, que es exactamente lo que la cabecera provisional hacía
# tolerable solo mientras todo era público.

sedes:
  get:
    operationId: listarSedesConfig
    summary: Todas las sedes del tenant, activas e inactivas (RF-30)
    tags: [configuracion]
    security: [{ TokenCliente: [] }]
    responses:
      '200':
        description: Las sedes
        content:
          application/json:
            schema: { $ref: '../componentes/esquemas/catalogo.yaml#/ListaSedes' }
      '401': { $ref: '../componentes/respuestas.yaml#/NoAutorizado' }
      '403': { $ref: '../componentes/respuestas.yaml#/FueraDeAlcance' }
      '500': { $ref: '../componentes/respuestas.yaml#/ErrorInterno' }

  post:
    operationId: crearSede
    summary: Crear una sede (RF-30)
    tags: [configuracion]
    security: [{ TokenCliente: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../componentes/esquemas/configuracion.yaml#/NuevaSede' }
    responses:
      '201':
        description: La sede creada
        content:
          application/json:
            schema: { $ref: '../componentes/esquemas/catalogo.yaml#/Sede' }
      '400': { $ref: '../componentes/respuestas.yaml#/PeticionInvalida' }
      '401': { $ref: '../componentes/respuestas.yaml#/NoAutorizado' }
      '403': { $ref: '../componentes/respuestas.yaml#/FueraDeAlcance' }
      '422': { $ref: '../componentes/respuestas.yaml#/NoProcesable' }
      '500': { $ref: '../componentes/respuestas.yaml#/ErrorInterno' }

sedePorId:
  patch:
    operationId: actualizarSede
    summary: Editar una sede (RF-30)
    description: |
      Desactivarla no cancela sus reservas: deja de poder elegirse para reservas
      nuevas y nada más. Cancelar lo ya vendido es una decisión aparte, y RF-32
      la hace explícita.
    tags: [configuracion]
    security: [{ TokenCliente: [] }]
    parameters: [{ $ref: '../componentes/parametros.yaml#/IdEnRuta' }]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../componentes/esquemas/configuracion.yaml#/ActualizacionSede' }
    responses:
      '200':
        description: La sede actualizada
        content:
          application/json:
            schema: { $ref: '../componentes/esquemas/catalogo.yaml#/Sede' }
      '400': { $ref: '../componentes/respuestas.yaml#/PeticionInvalida' }
      '401': { $ref: '../componentes/respuestas.yaml#/NoAutorizado' }
      '403': { $ref: '../componentes/respuestas.yaml#/FueraDeAlcance' }
      '404': { $ref: '../componentes/respuestas.yaml#/NoEncontrado' }
      '422': { $ref: '../componentes/respuestas.yaml#/NoProcesable' }
      '500': { $ref: '../componentes/respuestas.yaml#/ErrorInterno' }

servicios:
  get:
    operationId: listarServiciosConfig
    summary: Todos los servicios del tenant (RF-30)
    tags: [configuracion]
    security: [{ TokenCliente: [] }]
    responses:
      '200':
        description: Los servicios
        content:
          application/json:
            schema: { $ref: '../componentes/esquemas/catalogo.yaml#/ListaServicios' }
      '401': { $ref: '../componentes/respuestas.yaml#/NoAutorizado' }
      '403': { $ref: '../componentes/respuestas.yaml#/FueraDeAlcance' }
      '500': { $ref: '../componentes/respuestas.yaml#/ErrorInterno' }

  post:
    operationId: crearServicio
    summary: Crear un servicio (RF-30, RF-31)
    tags: [configuracion]
    security: [{ TokenCliente: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../componentes/esquemas/configuracion.yaml#/NuevoServicio' }
    responses:
      '201':
        description: El servicio creado
        content:
          application/json:
            schema: { $ref: '../componentes/esquemas/catalogo.yaml#/Servicio' }
      '400': { $ref: '../componentes/respuestas.yaml#/PeticionInvalida' }
      '401': { $ref: '../componentes/respuestas.yaml#/NoAutorizado' }
      '403': { $ref: '../componentes/respuestas.yaml#/FueraDeAlcance' }
      '422': { $ref: '../componentes/respuestas.yaml#/NoProcesable' }
      '500': { $ref: '../componentes/respuestas.yaml#/ErrorInterno' }

servicioPorId:
  patch:
    operationId: actualizarServicio
    summary: Editar un servicio (RF-30, RF-31)
    description: |
      Cambiar el precio o la duración NO altera ninguna reserva existente: la
      reserva congela ambos al crearse (RF-31). Es lo que permite editar el
      catálogo sin revisar la agenda.
    tags: [configuracion]
    security: [{ TokenCliente: [] }]
    parameters: [{ $ref: '../componentes/parametros.yaml#/IdEnRuta' }]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../componentes/esquemas/configuracion.yaml#/ActualizacionServicio' }
    responses:
      '200':
        description: El servicio actualizado
        content:
          application/json:
            schema: { $ref: '../componentes/esquemas/catalogo.yaml#/Servicio' }
      '400': { $ref: '../componentes/respuestas.yaml#/PeticionInvalida' }
      '401': { $ref: '../componentes/respuestas.yaml#/NoAutorizado' }
      '403': { $ref: '../componentes/respuestas.yaml#/FueraDeAlcance' }
      '404': { $ref: '../componentes/respuestas.yaml#/NoEncontrado' }
      '422': { $ref: '../componentes/respuestas.yaml#/NoProcesable' }
      '500': { $ref: '../componentes/respuestas.yaml#/ErrorInterno' }

recursos:
  get:
    operationId: listarRecursos
    summary: Los recursos del tenant y qué servicios prestan (RF-30)
    tags: [configuracion]
    security: [{ TokenCliente: [] }]
    responses:
      '200':
        description: Los recursos
        content:
          application/json:
            schema: { $ref: '../componentes/esquemas/configuracion.yaml#/ListaRecursos' }
      '401': { $ref: '../componentes/respuestas.yaml#/NoAutorizado' }
      '403': { $ref: '../componentes/respuestas.yaml#/FueraDeAlcance' }
      '500': { $ref: '../componentes/respuestas.yaml#/ErrorInterno' }

  post:
    operationId: crearRecurso
    summary: Crear un recurso (RF-30)
    tags: [configuracion]
    security: [{ TokenCliente: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../componentes/esquemas/configuracion.yaml#/NuevoRecurso' }
    responses:
      '201':
        description: El recurso creado
        content:
          application/json:
            schema: { $ref: '../componentes/esquemas/configuracion.yaml#/Recurso' }
      '400': { $ref: '../componentes/respuestas.yaml#/PeticionInvalida' }
      '401': { $ref: '../componentes/respuestas.yaml#/NoAutorizado' }
      '403': { $ref: '../componentes/respuestas.yaml#/FueraDeAlcance' }
      '422': { $ref: '../componentes/respuestas.yaml#/NoProcesable' }
      '500': { $ref: '../componentes/respuestas.yaml#/ErrorInterno' }

recursoPorId:
  patch:
    operationId: actualizarRecurso
    summary: Editar un recurso (RF-30)
    tags: [configuracion]
    security: [{ TokenCliente: [] }]
    parameters: [{ $ref: '../componentes/parametros.yaml#/IdEnRuta' }]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../componentes/esquemas/configuracion.yaml#/ActualizacionRecurso' }
    responses:
      '200':
        description: El recurso actualizado
        content:
          application/json:
            schema: { $ref: '../componentes/esquemas/configuracion.yaml#/Recurso' }
      '400': { $ref: '../componentes/respuestas.yaml#/PeticionInvalida' }
      '401': { $ref: '../componentes/respuestas.yaml#/NoAutorizado' }
      '403': { $ref: '../componentes/respuestas.yaml#/FueraDeAlcance' }
      '404': { $ref: '../componentes/respuestas.yaml#/NoEncontrado' }
      '422': { $ref: '../componentes/respuestas.yaml#/NoProcesable' }
      '500': { $ref: '../componentes/respuestas.yaml#/ErrorInterno' }

reglas:
  get:
    operationId: listarReglas
    summary: Reglas de disponibilidad (RF-14)
    tags: [configuracion]
    security: [{ TokenCliente: [] }]
    parameters:
      - name: recurso_id
        in: query
        required: false
        schema: { type: string, format: uuid }
    responses:
      '200':
        description: Las reglas
        content:
          application/json:
            schema: { $ref: '../componentes/esquemas/configuracion.yaml#/ListaReglas' }
      '401': { $ref: '../componentes/respuestas.yaml#/NoAutorizado' }
      '403': { $ref: '../componentes/respuestas.yaml#/FueraDeAlcance' }
      '500': { $ref: '../componentes/respuestas.yaml#/ErrorInterno' }

  post:
    operationId: crearRegla
    summary: Publicar una regla de disponibilidad (RF-14)
    description: |
      Una regla no puede cruzar medianoche: el motor exige `hora_fin >
      hora_inicio`. Un turno de noche son DOS reglas, una por cada día que toca,
      y es la única forma en que el cálculo de disponibilidad puede resolverlo
      sin ambigüedad.
    tags: [configuracion]
    security: [{ TokenCliente: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../componentes/esquemas/configuracion.yaml#/NuevaRegla' }
    responses:
      '201':
        description: La regla creada
        content:
          application/json:
            schema: { $ref: '../componentes/esquemas/configuracion.yaml#/ReglaDisponibilidad' }
      '400': { $ref: '../componentes/respuestas.yaml#/PeticionInvalida' }
      '401': { $ref: '../componentes/respuestas.yaml#/NoAutorizado' }
      '403': { $ref: '../componentes/respuestas.yaml#/FueraDeAlcance' }
      '422': { $ref: '../componentes/respuestas.yaml#/NoProcesable' }
      '500': { $ref: '../componentes/respuestas.yaml#/ErrorInterno' }

reglaPorId:
  delete:
    operationId: eliminarRegla
    summary: Retirar una regla de disponibilidad (RF-14)
    description: |
      Retirarla no toca las reservas que ya se hicieron dentro de ella. Una
      reserva confirmada es un compromiso; que el horario deje de publicarse no
      lo deshace.
    tags: [configuracion]
    security: [{ TokenCliente: [] }]
    parameters: [{ $ref: '../componentes/parametros.yaml#/IdEnRuta' }]
    responses:
      '204': { description: Regla retirada. }
      '401': { $ref: '../componentes/respuestas.yaml#/NoAutorizado' }
      '403': { $ref: '../componentes/respuestas.yaml#/FueraDeAlcance' }
      '404': { $ref: '../componentes/respuestas.yaml#/NoEncontrado' }
      '500': { $ref: '../componentes/respuestas.yaml#/ErrorInterno' }

excepciones:
