  post:
    operationId: crearExcepcion
    summary: Tapar un período (RF-14)
    tags: [configuracion]
    security: [{ TokenCliente: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../componentes/esquemas/configuracion.yaml#/NuevaExcepcion' }
    responses:
      '201':
        description: La excepción creada
        content:
          application/json:
            schema: { $ref: '../componentes/esquemas/configuracion.yaml#/ExcepcionCalendario' }
      '400': { $ref: '../componentes/respuestas.yaml#/PeticionInvalida' }
      '401': { $ref: '../componentes/respuestas.yaml#/NoAutorizado' }
      '403': { $ref: '../componentes/respuestas.yaml#/FueraDeAlcance' }
      '422': { $ref: '../componentes/respuestas.yaml#/NoProcesable' }
      '500': { $ref: '../componentes/respuestas.yaml#/ErrorInterno' }

excepcionPorId:
  delete:
    operationId: eliminarExcepcion
    summary: Levantar una excepción de calendario (RF-14)
    tags: [configuracion]
    security: [{ TokenCliente: [] }]
    parameters: [{ $ref: '../componentes/parametros.yaml#/IdEnRuta' }]
    responses:
      '204': { description: Excepción levantada. }
      '401': { $ref: '../componentes/respuestas.yaml#/NoAutorizado' }
      '403': { $ref: '../componentes/respuestas.yaml#/FueraDeAlcance' }
      '404': { $ref: '../componentes/respuestas.yaml#/NoEncontrado' }
      '500': { $ref: '../componentes/respuestas.yaml#/ErrorInterno' }

politicas:
  get:
    operationId: listarPoliticas
    summary: Versiones de política publicadas (RF-15)
    tags: [configuracion]
    security: [{ TokenCliente: [] }]
    responses:
      '200':
        description: Las versiones, de la más reciente a la más antigua
        content:
          application/json:
            schema: { $ref: '../componentes/esquemas/configuracion.yaml#/ListaPoliticas' }
      '401': { $ref: '../componentes/respuestas.yaml#/NoAutorizado' }
      '403': { $ref: '../componentes/respuestas.yaml#/FueraDeAlcance' }
      '500': { $ref: '../componentes/respuestas.yaml#/ErrorInterno' }

  post:
    operationId: publicarPolitica
    summary: Publicar una versión de política (RF-15)
    description: |
      No hay PATCH ni DELETE, y no es un olvido: `politica_version` es
      inmutable por disparador. Publicar condiciones nuevas es publicar una
      versión nueva; las reservas existentes siguen apuntando a la que
      congelaron al crearse.
    tags: [configuracion]
    security: [{ TokenCliente: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../componentes/esquemas/configuracion.yaml#/NuevaPolitica' }
    responses:
      '201':
        description: La versión publicada
        content:
          application/json:
            schema: { $ref: '../componentes/esquemas/configuracion.yaml#/Politica' }
      '400': { $ref: '../componentes/respuestas.yaml#/PeticionInvalida' }
      '401': { $ref: '../componentes/respuestas.yaml#/NoAutorizado' }
      '403': { $ref: '../componentes/respuestas.yaml#/FueraDeAlcance' }
      '422': { $ref: '../componentes/respuestas.yaml#/NoProcesable' }
      '500': { $ref: '../componentes/respuestas.yaml#/ErrorInterno' }

vouchers:
  get:
    operationId: listarVouchers
    summary: Vouchers del tenant (RF-17)
    tags: [configuracion]
    security: [{ TokenCliente: [] }]
    responses:
      '200':
        description: Los vouchers
        content:
          application/json:
            schema: { $ref: '../componentes/esquemas/configuracion.yaml#/ListaVouchers' }
      '401': { $ref: '../componentes/respuestas.yaml#/NoAutorizado' }
      '403': { $ref: '../componentes/respuestas.yaml#/FueraDeAlcance' }
      '500': { $ref: '../componentes/respuestas.yaml#/ErrorInterno' }

  post:
    operationId: crearVoucher
    summary: Crear un voucher (RF-17)
    tags: [configuracion]
    security: [{ TokenCliente: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../componentes/esquemas/configuracion.yaml#/NuevoVoucher' }
    responses:
      '201':
        description: El voucher creado
        content:
          application/json:
            schema: { $ref: '../componentes/esquemas/configuracion.yaml#/Voucher' }
      '400': { $ref: '../componentes/respuestas.yaml#/PeticionInvalida' }
      '401': { $ref: '../componentes/respuestas.yaml#/NoAutorizado' }
      '403': { $ref: '../componentes/respuestas.yaml#/FueraDeAlcance' }
      '409':
        description: Ya existe un voucher con ese código en este tenant.
        content:
          application/problem+json:
            schema: { $ref: '../componentes/esquemas/comunes.yaml#/Problema' }
      '422': { $ref: '../componentes/respuestas.yaml#/NoProcesable' }
      '500': { $ref: '../componentes/respuestas.yaml#/ErrorInterno' }

voucherPorId:
  delete:
    operationId: eliminarVoucher
    summary: Eliminar un voucher (RF-17)
    description: |
      Borrado lógico: la fila permanece porque `uso_voucher` la referencia, y el
      código NO se libera. Reutilizarlo dejaría dos promociones distintas con el
      mismo código en el historial, y la traza de RNF-36 no podría distinguirlas.
    tags: [configuracion]
    security: [{ TokenCliente: [] }]
    parameters: [{ $ref: '../componentes/parametros.yaml#/IdEnRuta' }]
    responses:
      '204': { description: Voucher eliminado. }
      '401': { $ref: '../componentes/respuestas.yaml#/NoAutorizado' }
      '403': { $ref: '../componentes/respuestas.yaml#/FueraDeAlcance' }
      '404': { $ref: '../componentes/respuestas.yaml#/NoEncontrado' }
      '500': { $ref: '../componentes/respuestas.yaml#/ErrorInterno' }

tarifas:
  get:
    operationId: listarTarifas
    summary: Tarifas del tenant (RF-31)
    tags: [configuracion]
    security: [{ TokenCliente: [] }]
    parameters:
      - name: servicio_id
        in: query
        required: false
        schema: { type: string, format: uuid }
    responses:
      '200':
        description: Las tarifas, de mayor a menor prioridad
        content:
          application/json:
            schema: { $ref: '../componentes/esquemas/configuracion.yaml#/ListaTarifas' }
      '401': { $ref: '../componentes/respuestas.yaml#/NoAutorizado' }
      '403': { $ref: '../componentes/respuestas.yaml#/FueraDeAlcance' }
      '500': { $ref: '../componentes/respuestas.yaml#/ErrorInterno' }

  post:
    operationId: crearTarifa
    summary: Publicar una tarifa (RF-31)
    tags: [configuracion]
    security: [{ TokenCliente: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../componentes/esquemas/configuracion.yaml#/NuevaTarifa' }
    responses:
      '201':
        description: La tarifa creada
        content:
          application/json:
            schema: { $ref: '../componentes/esquemas/configuracion.yaml#/Tarifa' }
      '400': { $ref: '../componentes/respuestas.yaml#/PeticionInvalida' }
      '401': { $ref: '../componentes/respuestas.yaml#/NoAutorizado' }
      '403': { $ref: '../componentes/respuestas.yaml#/FueraDeAlcance' }
      '422': { $ref: '../componentes/respuestas.yaml#/NoProcesable' }
      '500': { $ref: '../componentes/respuestas.yaml#/ErrorInterno' }

tarifaPorId:
  delete:
    operationId: eliminarTarifa
    summary: Retirar una tarifa (RF-31)
    description: |
      Retirarla no cambia ningún precio ya cobrado: la reserva congeló el suyo
      al crearse.
    tags: [configuracion]
    security: [{ TokenCliente: [] }]
    parameters: [{ $ref: '../componentes/parametros.yaml#/IdEnRuta' }]
    responses:
      '204': { description: Tarifa retirada. }
      '401': { $ref: '../componentes/respuestas.yaml#/NoAutorizado' }
      '403': { $ref: '../componentes/respuestas.yaml#/FueraDeAlcance' }
      '404': { $ref: '../componentes/respuestas.yaml#/NoEncontrado' }
      '500': { $ref: '../componentes/respuestas.yaml#/ErrorInterno' }

auditoria:
  get:
    operationId: consultarAuditoria
    summary: Consultar la auditoría (RF-36)
    description: |
      Devuelve los eventos dentro del alcance de quien pregunta: solo su tenant
      para un administrador (RF-23). Append-only: no hay forma de modificar ni
      de borrar nada desde aquí, y tampoco desde ninguna otra parte, porque un
      disparador lo impide en el motor.
    tags: [configuracion]
    security: [{ TokenCliente: [] }]
    parameters:
      - name: desde
        in: query
        required: false
        schema: { type: string, format: date-time }
      - name: hasta
        in: query
        required: false
        schema: { type: string, format: date-time }
      - name: actor_id
        in: query
        required: false
        schema: { type: string, format: uuid }
      - name: recurso_tipo
        in: query
        required: false
        schema: { type: string }
      - name: accion
        in: query
        required: false
        schema: { type: string }
      - name: limite
        in: query
        required: false
        schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      - name: cursor
        in: query
        required: false
        schema: { type: string }
    responses:
      '200':
        description: Página de eventos, del más reciente al más antiguo
        content:
          application/json:
            schema: { $ref: '../componentes/esquemas/configuracion.yaml#/ListaAuditoria' }
      '400': { $ref: '../componentes/respuestas.yaml#/PeticionInvalida' }
      '401': { $ref: '../componentes/respuestas.yaml#/NoAutorizado' }
      '403': { $ref: '../componentes/respuestas.yaml#/FueraDeAlcance' }
      '500': { $ref: '../componentes/respuestas.yaml#/ErrorInterno' }
