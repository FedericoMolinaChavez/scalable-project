# Respuestas de error, comunes a todas las rutas. Todas usan el mismo formato
# (RFC 9457) para que un error sea indistinguible venga del componente que venga.

PeticionInvalida:
  description: La petición está mal formada
  content:
    application/problem+json:
      schema: { $ref: './esquemas/comunes.yaml#/Problema' }

NoEncontrado:
  description: |
    No existe. Bajo RLS, "no existe" y "existe pero es de otro tenant" son
    indistinguibles, y así debe ser: distinguirlos filtraría la existencia de
    datos ajenos.
  content:
    application/problem+json:
      schema: { $ref: './esquemas/comunes.yaml#/Problema' }

NoAutorizado:
  description: |
    Falta el token de acceso, o ya no vale. No distingue entre "no lo mandaste"
    y "el que mandaste está mal": para quien prueba tokens, saber cuál de las
    dos cosas falló es la mitad del trabajo hecho.

    El vencimiento SÍ se distingue en el `type` del problema, y no es una
    contradicción: caducar no es un fallo de quien lo presenta, es el
    funcionamiento normal, y la interfaz tiene que poder decir "vuelve a
    identificarte" en vez de "no eres tú".
  content:
    application/problem+json:
      schema: { $ref: './esquemas/comunes.yaml#/Problema' }

FueraDeAlcance:
  description: |
    La identificación es válida pero el recurso queda fuera del alcance de esa
    cuenta (RF-23).

    Se distingue del 401 a propósito: un 401 dice "no sé quién eres" y la
    interfaz responde pidiendo identificarse otra vez, cosa que aquí no
    arreglaría nada. Y no sustituye al 404 de un recurso ajeno: cuando decir
    "existe pero no es tuyo" ya filtra la existencia del recurso, la respuesta
    correcta sigue siendo 404. Este 403 es para las acciones cuyo alcance no
    depende de un identificador que haya que adivinar.
  content:
    application/problem+json:
      schema: { $ref: './esquemas/comunes.yaml#/Problema' }

NoProcesable:
  description: Sintácticamente válida pero viola una regla de negocio
  content:
    application/problem+json:
      schema: { $ref: './esquemas/comunes.yaml#/Problema' }

DemasiadasPeticiones:
  description: Se superó la cuota de la cuenta o del agente (RNF-08)
  headers:
    Retry-After:
      schema: { type: integer }
  content:
    application/problem+json:
      schema: { $ref: './esquemas/comunes.yaml#/Problema' }

ErrorInterno:
  description: Error no previsto
  content:
    application/problem+json:
      schema: { $ref: './esquemas/comunes.yaml#/Problema' }
