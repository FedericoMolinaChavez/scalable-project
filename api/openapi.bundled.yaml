openapi: 3.1.0
info:
  title: API de reservas
  version: 0.1.0
  description: |
    Contrato único entre el backend en Go y el frontend en React. Los tipos de
    ambos lados se generan desde aquí, así que este archivo es la fuente de
    verdad: un cambio que rompa el contrato rompe la compilación de los dos, en
    vez de aparecer como un fallo en tiempo de ejecución.

    Cubre el catálogo, la disponibilidad y las reservas (RF-01, RF-02, RF-03,
    RF-06, RF-09, RF-26), y las cuentas con su acceso (RF-12, RF-13, RF-18,
    RF-19, RF-21, RF-22, RF-23, RF-24, RF-25). El resto de los RF se añaden a
    medida que se implementan.
servers:
  - url: http://localhost:8080
    description: Desarrollo local
tags:
  - name: catalogo
    description: Sedes y servicios (RF-26)
  - name: disponibilidad
    description: Consulta de horarios libres (RF-26)
  - name: reservas
    description: Creación y consulta de reservas (RF-01, RF-02, RF-03, RF-06)
  - name: sesiones
    description: |
      Identificación del cliente. Dos puertas distintas sobre la misma etiqueta:
      el código de un solo uso del invitado (RF-02) y el inicio de sesión de una
      cuenta con sus tokens y su lista de sesiones (RF-12, RF-25).
  - name: cuentas
    description: Alta, perfil, verificación, contraseña y preferencias (RF-18, RF-19, RF-21, RF-22, RF-24, RF-25)
  - name: agentes
    description: Intercambio de credencial por token de acciones (RF-13)
paths:
  /v1/sedes:
    get:
      operationId: listarSedes
      security: []
      summary: Sedes del tenant
      tags:
        - catalogo
      parameters:
        - $ref: '#/components/parameters/Tenant'
      responses:
        '200':
          description: Listado de sedes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaSedes'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /v1/servicios:
    get:
      operationId: listarServicios
      security: []
      summary: Servicios ofrecidos, opcionalmente filtrados por sede
      tags:
        - catalogo
      parameters:
        - $ref: '#/components/parameters/Tenant'
        - name: sede_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Listado de servicios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaServicios'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /v1/disponibilidad:
    get:
      operationId: consultarDisponibilidad
      security: []
      summary: Franjas libres de un servicio en un rango
      description: |
        Sirve el 90% del tráfico (RNF-03) desde caché, con los 2 s de
        desactualización que RNF-10 autoriza.

        La lectura es optimista a propósito: puede devolver una franja que otro
        cliente acaba de tomar. Quien decide es el núcleo al insertar, contra la
        restricción EXCLUDE (flujo alternativo 3 de RF-01). Un cliente que trate
        esta respuesta como una reserva garantizada está mal escrito.
      tags:
        - disponibilidad
      parameters:
        - $ref: '#/components/parameters/Tenant'
        - name: servicio_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: desde
          in: query
          required: true
          description: Instante inicial, inclusive.
          schema:
            type: string
            format: date-time
        - name: hasta
          in: query
          required: true
          description: Instante final, exclusive.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Franjas libres
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Disponibilidad'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /v1/sesiones/codigo:
    post:
      operationId: solicitarCodigo
      security: []
      summary: Pedir un código para ver las reservas propias
      description: |
        Manda un código de seis dígitos al correo indicado (RF-02, con los
        parámetros de RF-19: seis dígitos, vigencia corta, un solo uso).

        **Responde igual exista o no ese correo** (RF-12 A12). Distinguirlos
        permitiría enumerar quién ha reservado en el negocio probando direcciones.

        Pedir un código nuevo invalida el anterior del mismo destino: tres códigos
        vivos a la vez triplicarían lo que puede adivinar quien los esté probando.
      tags:
        - sesiones
      parameters:
        - $ref: '#/components/parameters/Tenant'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudCodigo'
      responses:
        '202':
          description: |
            Aceptado. NO significa que el correo exista ni que se haya entregado
            nada: significa que si existe, el código va en camino. Es un 202 y no
            un 200 justamente porque no se puede afirmar el resultado sin
            filtrarlo.
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /v1/sesiones/token:
    post:
      operationId: canjearCodigo
      security: []
      summary: Canjear el código por un token de acceso
      tags:
        - sesiones
      parameters:
        - $ref: '#/components/parameters/Tenant'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CanjeCodigo'
      responses:
        '200':
          description: Código correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenAcceso'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          description: |
            El código no vale: equivocado, caducado, ya usado o inexistente. Los
            cuatro casos responden igual, porque cada distinción le diría a quien
            esté probando códigos si va por buen camino.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /v1/sesiones/contrasena:
    post:
      operationId: iniciarSesion
      security: []
      summary: Iniciar sesión con contraseña (RF-12)
      description: |
        Credenciales incorrectas, cuenta inexistente y contraseña sin definir
        responden lo mismo: `401` con el mismo cuerpo. La tercera importa más de
        lo que parece —una cuenta creada por magic link no tiene contraseña— y
        distinguirla revelaría qué direcciones están registradas.

        Una cuenta suspendida o pendiente de verificación SÍ se distingue
        (RF-12 A8), y no contradice lo anterior: quien llega hasta ahí ya
        demostró saber la contraseña, así que no se le está diciendo nada que no
        supiera.

        Los intentos fallidos consecutivos se cuentan por cuenta y bloquean el
        acceso durante un rato (RF-12 A3/A4). El bloqueo responde `429`, no
        `401`: no es que las credenciales estén mal, es que hay que esperar.
      tags:
        - sesiones
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credenciales'
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParTokens'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '422':
          $ref: '#/components/responses/NoProcesable'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /v1/sesiones/enlace:
    post:
      operationId: solicitarEnlace
      security: []
      summary: Pedir un magic link para entrar (RF-12)
      description: |
        Enlace de un solo uso, quince minutos de vigencia. **Responde igual exista
        o no la cuenta** (RF-12 A12).
      tags:
        - sesiones
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudEnlace'
      responses:
        '202':
          description: Si esa dirección tiene cuenta, el enlace va en camino.
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /v1/sesiones/enlace/canje:
    post:
      operationId: canjearEnlace
      security: []
      summary: Canjear el magic link por una sesión (RF-12)
      tags:
        - sesiones
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CanjeEnlace'
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParTokens'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '422':
          $ref: '#/components/responses/NoProcesable'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /v1/sesiones/refresco:
    post:
      operationId: refrescarSesion
      security: []
      summary: Renovar el par de tokens (RF-12)
      description: |
        El token de refresco ROTA: el que se presenta deja de valer y se entrega
        otro. Es lo que hace que un refresco copiado se note —el primero de los
        dos en canjearlo deja al otro fuera— en vez de quedar utilizable en
        paralelo hasta que caduque la sesión.

        Un refresco revocado, vencido o desconocido responde `401` sin
        distinguirlos.
      tags:
        - sesiones
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudRefresco'
      responses:
        '200':
          description: Par renovado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParTokens'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /v1/sesiones:
    get:
      operationId: listarSesiones
      summary: Sesiones activas (RF-25)
      tags:
        - sesiones
      security:
        - TokenCliente: []
      responses:
        '200':
          description: Las sesiones vivas de la cuenta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaSesiones'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/FueraDeAlcance'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    delete:
      operationId: revocarTodasLasSesiones
      summary: Cerrar todas las sesiones (RF-25)
      description: |
        Incluye la propia. Es lo que se pulsa cuando se sospecha que alguien más
        entró, y dejar viva justo la sesión desde la que se pulsa obligaría a
        confiar en que la comprometida no es esa.
      tags:
        - sesiones
      security:
        - TokenCliente: []
      responses:
        '204':
          description: Todas las sesiones quedaron revocadas.
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/FueraDeAlcance'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /v1/sesiones/{id}:
    delete:
      operationId: revocarSesion
      summary: Revocar una sesión concreta (RF-25)
      description: |
        Una sesión de otra cuenta responde `404`, no `403`: un 403 confirmaría que
        ese identificador existe.
      tags:
        - sesiones
      security:
        - TokenCliente: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Sesión revocada.
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/FueraDeAlcance'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /v1/cuentas:
    post:
      operationId: registrarCuenta
      security: []
      summary: Registrar una cuenta (RF-24)
      description: |
        Crea la cuenta en estado `pendiente_verificacion` y dispara la
        verificación del contacto (RF-19). No devuelve tokens: hasta que el
        correo esté verificado no hay cuenta activa con la que iniciar sesión.

        **Responde `202` exista o no ya ese correo.** Cuando ya existe no se crea
        nada y se avisa al titular del intento, que es lo que RF-24 pide: quien
        prueba direcciones recibe siempre la misma respuesta, y el dueño de la
        dirección se entera.
      tags:
        - cuentas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevaCuenta'
      responses:
        '202':
          description: |
            Aceptado. NO significa que la cuenta se haya creado: significa que si
            esa dirección estaba libre, la verificación va en camino. Es un 202 y
            no un 201 precisamente porque no se puede afirmar el resultado sin
            filtrarlo.
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '422':
          $ref: '#/components/responses/NoProcesable'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /v1/cuentas/yo:
    get:
      operationId: obtenerCuentaPropia
      summary: El perfil propio (RF-22)
      tags:
        - cuentas
      security:
        - TokenCliente: []
      responses:
        '200':
          description: La cuenta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cuenta'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/FueraDeAlcance'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    patch:
      operationId: actualizarCuentaPropia
      summary: Editar el perfil (RF-22)
      description: |
        Cambiar el correo o el teléfono lo marca como NO verificado y dispara la
        verificación de RF-19. El dato nuevo no sirve para recuperar la cuenta ni
        para recibir avisos hasta que se verifique: si bastara con escribirlo,
        apuntar la cuenta a una dirección propia sería suficiente para
        interceptar los avisos de otra persona.

        Un correo o teléfono que ya está en otra cuenta responde `409`, no `422`:
        la petición es válida y la regla no se viola, lo que ocurre es que ese
        valor ya está tomado.
      tags:
        - cuentas
      security:
        - TokenCliente: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizacionCuenta'
      responses:
        '200':
          description: La cuenta ya actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cuenta'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/FueraDeAlcance'
        '409':
          description: Ese correo o teléfono ya está registrado en otra cuenta.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '422':
          $ref: '#/components/responses/NoProcesable'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    delete:
      operationId: eliminarCuentaPropia
      summary: Eliminar la cuenta (RF-25)
      description: |
        Anonimiza los datos personales, revoca todas las sesiones y cancela las
        reservas futuras todavía activas.

        No borra la fila. Los comprobantes de RF-34 la referencian y hay
        obligaciones fiscales detrás; lo que desaparece es lo que identifica a una
        persona, no la contabilidad. El correo queda libre para volver a
        registrarse, porque los índices de unicidad excluyen las cuentas
        eliminadas.
      tags:
        - cuentas
      security:
        - TokenCliente: []
      responses:
        '204':
          description: Cuenta anonimizada y sesiones revocadas.
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/FueraDeAlcance'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /v1/cuentas/yo/preferencias:
    get:
      operationId: listarPreferencias
      summary: Preferencias de notificación (RF-21)
      description: |
        Devuelve solo lo que se ha guardado explícitamente. Lo que no aparece está
        en el valor por defecto del producto, que NO es lo mismo que
        deshabilitado.
      tags:
        - cuentas
      security:
        - TokenCliente: []
      responses:
        '200':
          description: Las preferencias guardadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaPreferencias'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/FueraDeAlcance'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    put:
      operationId: guardarPreferencias
      summary: Guardar preferencias de notificación (RF-21)
      description: |
        Reemplaza el conjunto completo. Un PUT y no un PATCH porque la pantalla de
        RF-21 se guarda entera: con PATCH, quitar una preferencia exigiría un
        verbo aparte para decir "vuelve al valor por defecto", y esa distinción es
        justo la que se pierde entre lo que se envía y lo que se omite.
      tags:
        - cuentas
      security:
        - TokenCliente: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListaPreferencias'
      responses:
        '200':
          description: Las preferencias ya guardadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaPreferencias'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/FueraDeAlcance'
        '422':
          $ref: '#/components/responses/NoProcesable'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /v1/cuentas/verificacion:
    post:
      operationId: solicitarVerificacion
      summary: Pedir la verificación del contacto (RF-19)
      tags:
        - cuentas
      security:
        - TokenCliente: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudVerificacion'
      responses:
        '202':
          description: Si ese contacto está sin verificar, el envío va en camino.
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '422':
          $ref: '#/components/responses/NoProcesable'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /v1/cuentas/verificacion/canje:
    post:
      operationId: canjearVerificacion
      security: []
      summary: Canjear el enlace o el código de verificación (RF-19)
      description: |
        Marca el contacto como verificado y, si la cuenta estaba
        `pendiente_verificacion`, la activa. A partir de ahí ya puede iniciar
        sesión (RF-12).

        Un valor caducado, ya usado o inexistente responde igual: `401`, sin
        decir cuál de los tres fue.
      tags:
        - cuentas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CanjeVerificacion'
      responses:
        '200':
          description: Contacto verificado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cuenta'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /v1/cuentas/yo/contrasena:
    post:
      operationId: cambiarContrasena
      summary: Cambiar la propia contraseña (RF-18, y destino de RF-12 A9)
      description: |
        Exige la contraseña actual aunque ya haya sesión: un token robado no debe
        bastar para quedarse con la cuenta.

        Revoca las DEMÁS sesiones y conserva la que hace el cambio.
      tags:
        - cuentas
      security:
        - TokenCliente: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambioContrasena'
      responses:
        '204':
          description: Contraseña cambiada y las demás sesiones revocadas.
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/FueraDeAlcance'
        '422':
          $ref: '#/components/responses/NoProcesable'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /v1/cuentas/contrasena/restablecimiento:
    post:
      operationId: restablecerContrasena
      security: []
      summary: Restablecer la contraseña con el enlace recibido (RF-18)
      description: |
        Un token caducado, ya usado o inexistente responde `401` sin
        distinguirlos.

        Revoca TODAS las sesiones, incluida cualquiera que estuviera abierta.
      tags:
        - cuentas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Restablecimiento'
      responses:
        '204':
          description: Contraseña restablecida y sesiones revocadas.
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '422':
          $ref: '#/components/responses/NoProcesable'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /v1/cuentas/contrasena/recuperacion:
    post:
      operationId: solicitarRecuperacion
      security: []
      summary: Pedir el enlace de recuperación de contraseña (RF-18)
      description: |
        **Responde `202` exista o no la cuenta**, y no envía nada cuando no
        existe. Es el mismo criterio anti-enumeración de RF-12 A12.
      tags:
        - cuentas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudRecuperacion'
      responses:
        '202':
          description: Si esa dirección tiene cuenta, el enlace va en camino.
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /v1/agentes/token:
    post:
      operationId: intercambiarTokenAgente
      security: []
      summary: Intercambiar la credencial por un token de acciones (RF-13)
      description: |
        Emite un token de vigencia corta acotado a `acciones ∩ alcance de la
        cuenta impersonada` (RF-23). El alcance concedido puede ser menor que el
        pedido y viaja en la respuesta.

        Las tres razones de rechazo —credencial que no vale, cuenta que no
        autorizó a este agente (RNF-07), acciones fuera del alcance de esa
        cuenta— responden el mismo `403`. Separarlas le diría a quien prueba
        credenciales cuál de los tres pasos ya superó.

        El límite de acciones repetidas de RF-13 se aplica aquí como un `429`
        sobre el par agente/cuenta, no como un `403`: pedir demasiado seguido no
        es una falta de permiso, es el sistema pidiendo que espere.
      tags:
        - agentes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntercambioAgente'
      responses:
        '200':
          description: Token emitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenAgente'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '403':
          $ref: '#/components/responses/FueraDeAlcance'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /v1/reservas:
    get:
      operationId: listarReservas
      summary: Reservas de quien pide (RF-02, filtros de RF-09)
      description: |
        El alcance NO es fijo: sale de quién presenta el token (RF-23). Hoy solo
        existe el token de invitado, así que devuelve las reservas hechas con el
        correo que ese token acredita.

        Con un token de cuenta el alcance sale del tipo (RF-23): un `usuario` ve
        las suyas, un `administrador` ve las de su tenant (RF-32) y un agente, las
        de la cuenta que representa (RF-05). Es una operación con el alcance
        acotado por la cuenta, no cuatro rutas distintas por rol.

        Los filtros `sede_id` y `recurso_id` solo tienen sentido en el alcance del
        administrador —la agenda de RF-32 se recorre por sede y por recurso— pero
        no se rechazan a un `usuario`: acotar lo propio por sede es una consulta
        legítima, y prohibirla obligaría a que el filtro supiera de roles.
      tags:
        - reservas
      security:
        - TokenCliente: []
      parameters:
        - $ref: '#/components/parameters/Tenant'
        - name: estado
          in: query
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/EstadoReserva'
          style: form
          explode: false
        - name: desde
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: hasta
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: sede_id
          in: query
          required: false
          description: Agenda de una sede (RF-32).
          schema:
            type: string
            format: uuid
        - name: recurso_id
          in: query
          required: false
          description: Agenda de un recurso concreto (RF-32).
          schema:
            type: string
            format: uuid
        - name: limite
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: |
            Cursor opaco de la página siguiente. Paginación por cursor y no por
            desplazamiento: con OFFSET, insertar una fila mientras se pagina
            desplaza el resto y el cliente ve duplicados o se salta filas.
          schema:
            type: string
      responses:
        '200':
          description: Página de reservas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaReservas'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/FueraDeAlcance'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    post:
      operationId: crearReserva
      security: []
      summary: Crear una reserva (RF-01)
      description: |
        Ruta crítica de RNF-01: presupuesto de 200 ms. Devuelve una reserva
        **pendiente** con el cupo ya garantizado, sin esperar a que el pago se
        confirme. La confirmación llega después por el webhook de Stripe (RF-33),
        fuera de este presupuesto.

        La reserva pendiente caduca en `expira_en`. Si el pago no llega antes, un
        trabajador la marca expirada y libera el cupo (RF-27).
      tags:
        - reservas
      parameters:
        - $ref: '#/components/parameters/Tenant'
        - name: Idempotency-Key
          in: header
          required: true
          description: |
            Clave única de la operación. Obligatoria, no opcional: un agente que
            reintenta un POST tras un timeout crearía dos bloqueos que nadie
            libera hasta el TTL. Repetir la misma clave devuelve la reserva ya
            creada en vez de crear otra.
          schema:
            type: string
            minLength: 8
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevaReserva'
      responses:
        '201':
          description: Reserva creada, pendiente de pago
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaCreada'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: |
            El horario ya está tomado. Es la respuesta al rechazo de la
            restricción EXCLUDE por otra transacción concurrente: no es un error
            del cliente ni del servidor, es el resultado normal de perder una
            carrera por el mismo cupo.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '422':
          $ref: '#/components/responses/NoProcesable'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /v1/reservas/{id}:
    get:
      operationId: obtenerReserva
      summary: Detalle de una reserva (RF-03)
      description: |
        Una reserva que existe pero es de otra persona responde `404`, no `403`.
        Un 403 confirmaría que esa reserva existe, y con identificadores ajenos
        eso permite comprobar cuáles son reales.
      tags:
        - reservas
      security:
        - TokenCliente: []
      parameters:
        - $ref: '#/components/parameters/Tenant'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: La reserva
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /v1/reservas/{id}/cancelacion:
    post:
      operationId: cancelarReserva
      summary: Cancelar una reserva (RF-06)
      description: |
        Aplica la política que la reserva congeló al crearse, no la vigente hoy
        (RF-15). Es lo que impide que un negocio endurezca su política el martes y
        se la aplique a quien reservó el lunes bajo otras condiciones.

        Fuera del plazo de cancelación responde `422` con lo que faltaba, no un
        `403`: no es una cuestión de permisos, es que la regla del negocio no lo
        permite en ese momento.

        El reembolso NO ocurre aquí. Se dispara aparte (RF-29) y por eso la
        respuesta no dice nada del dinero: prometerlo en esta respuesta sería
        afirmar algo que este componente no puede garantizar.
      tags:
        - reservas
      security:
        - TokenCliente: []
      parameters:
        - $ref: '#/components/parameters/Tenant'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: La reserva, ya cancelada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: |
            La reserva ya no está en un estado que se pueda cancelar: ya estaba
            cancelada, ya se completó, o el bloqueo expiró solo.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '422':
          $ref: '#/components/responses/NoProcesable'
        '500':
          $ref: '#/components/responses/ErrorInterno'
components:
  securitySchemes:
    TokenCliente:
      type: http
      scheme: bearer
      description: |
        Un solo encabezado para tres portadores distintos, porque RF-23 modela
        el alcance como una propiedad de la cuenta y no de la ruta:

        - **Invitado** (`POST /v1/sesiones/token`): acredita que quien lo
          presenta controla ese correo. Sin cuenta detrás y sin roles: su
          alcance son exactamente las reservas hechas con esa dirección (RF-02).
        - **Cuenta** (`POST /v1/sesiones/contrasena`, `.../enlace/canje`,
          `.../refresco`): su alcance sale del tipo de cuenta (RF-23). Un
          `usuario` ve lo suyo, un `administrador` ve su tenant entero (RF-32).
        - **Agente** (`POST /v1/agentes/token`): actúa en nombre de una cuenta,
          con el alcance ya intersecado al emitirlo (RF-13). Nunca recibe más
          del que ya tiene la cuenta impersonada.

        Todos son de vigencia corta y ninguno se comprueba contra la base al
        verificarlo: es lo que le permite sostener la ruta de lectura de RNF-03.
        Lo que sí se revoca es la SESIÓN (RF-25), y corta el refresco al
        instante; el de acceso muere al vencer. La ventana de revocación es, por
        tanto, exactamente su vigencia.
  parameters:
    Tenant:
      name: X-Tenant-Id
      in: header
      required: true
      description: |
        Tenant sobre el que se opera. Provisional: en cuanto exista autenticación
        (RF-12) el tenant se deriva del token y esta cabecera desaparece. Aceptarla
        de un cliente en producción permitiría leer los datos de cualquier otro
        tenant.
      schema:
        type: string
        format: uuid
  schemas:
    EstadoCatalogo:
      type: string
      enum:
        - activo
        - inactivo
    Sede:
      type: object
      required:
        - id
        - nombre
        - zona_horaria
        - estado
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        zona_horaria:
          type: string
          description: |
            Identificador IANA. Se guarda por sede y no global porque un tenant
            puede operar en varias zonas (RF-38), y una franja horaria sin zona es
            ambigua dos veces al año.
          examples:
            - America/Bogota
        direccion:
          type: string
        estado:
          $ref: '#/components/schemas/EstadoCatalogo'
    ListaSedes:
      type: object
      required:
        - datos
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Sede'
    Problema:
      type: object
      description: |
        Formato de error único de la API, según RFC 9457 (problem details). Se usa
        un estándar en vez de un formato propio para que el cliente pueda tratar los
        errores de forma uniforme y para que una respuesta de error sea
        indistinguible venga del componente de ARQ-01 que venga.
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          description: Identificador estable del tipo de problema.
          examples:
            - https://api.reservas/errores/horario-ocupado
        title:
          type: string
          description: Resumen legible, constante para un mismo type.
        status:
          type: integer
          description: Código HTTP, repetido en el cuerpo.
        detail:
          type: string
          description: Explicación concreta de esta ocurrencia.
        instance:
          type: string
          description: Identificador de la petición, para cruzar con las trazas.
        errores:
          type: array
          description: Detalle por campo, cuando el problema es de validación.
          items:
            type: object
            required:
              - campo
              - mensaje
            properties:
              campo:
                type: string
              mensaje:
                type: string
    Dinero:
      type: object
      description: |
        El monto va como cadena decimal, no como número. En JSON los números son de
        coma flotante y 80000.10 no se representa exactamente; con dinero eso acaba
        en un céntimo de diferencia entre lo que se cobra y lo que se muestra. La
        columna del esquema es `numeric`, que sí es exacta, y una cadena la preserva
        de extremo a extremo.
      required:
        - monto
        - moneda
      properties:
        monto:
          type: string
          pattern: ^-?\d+(\.\d{1,4})?$
          examples:
            - '80000.00'
        moneda:
          type: string
          minLength: 3
          maxLength: 3
          description: Código ISO 4217.
          examples:
            - COP
    Servicio:
      type: object
      required:
        - id
        - sede_id
        - nombre
        - duracion_min
        - precio
        - estado
      properties:
        id:
          type: string
          format: uuid
        sede_id:
          type: string
          format: uuid
        nombre:
          type: string
        descripcion:
          type: string
        duracion_min:
          type: integer
          minimum: 1
          description: Duración en minutos.
        precio:
          $ref: '#/components/schemas/Dinero'
        estado:
          $ref: '#/components/schemas/EstadoCatalogo'
    ListaServicios:
      type: object
      required:
        - datos
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Servicio'
    Periodo:
      type: object
      description: |
        Intervalo semiabierto `[inicio, fin)`. El límite inferior entra, el superior
        no.

        No es un detalle de estilo: con ambos límites cerrados, 10:00–11:00 y
        11:00–12:00 comparten un instante, el operador `&&` de PostgreSQL las declara
        solapadas y la restricción EXCLUDE rechazaría dos citas consecutivas
        perfectamente válidas.
      required:
        - inicio
        - fin
      properties:
        inicio:
          type: string
          format: date-time
        fin:
          type: string
          format: date-time
    Franja:
      type: object
      required:
        - periodo
        - recurso_id
      properties:
        periodo:
          $ref: '#/components/schemas/Periodo'
        recurso_id:
          type: string
          format: uuid
    Disponibilidad:
      type: object
      required:
        - servicio_id
        - franjas
        - calculada_en
      properties:
        servicio_id:
          type: string
          format: uuid
        franjas:
          type: array
          items:
            $ref: '#/components/schemas/Franja'
        calculada_en:
          type: string
          format: date-time
          description: |
            Cuándo se calculó esta vista. El cliente puede saber así cuánta
            desactualización está viendo, dentro de los 2 s que RNF-10 permite.
    SolicitudCodigo:
      type: object
      description: |
        Pide un código al correo con el que se reservó.

        La respuesta es SIEMPRE la misma exista o no ese correo (RF-12 A12). Una
        respuesta que los distinguiera convertiría esta ruta en un buscador de
        clientes del negocio: se prueban direcciones y las que contesten distinto
        son las que reservaron.
      required:
        - destino
      properties:
        destino:
          type: string
          format: email
          description: El correo con el que se hizo la reserva.
          examples:
            - ana@ejemplo.test
    CanjeCodigo:
      type: object
      required:
        - destino
        - codigo
      properties:
        destino:
          type: string
          format: email
        codigo:
          type: string
          pattern: ^[0-9]{6}$
          description: |
            Los seis dígitos recibidos. Un solo uso y tres intentos (RF-12 A2):
            agotados, el código se quema y hay que pedir otro.
          examples:
            - '042317'
    TokenAcceso:
      type: object
      description: |
        Lo que se entrega al acertar el código.

        Es de vigencia corta y no se puede revocar: un invitado no tiene sesión que
        gestionar, así que la única defensa de este token es que caduque pronto. Por
        eso viaja `expira_en`: la interfaz puede pedir que se identifique otra vez
        ANTES de que falle una petición, en vez de después.
      required:
        - token
        - expira_en
      properties:
        token:
          type: string
          description: 'Se manda en la cabecera `Authorization: Bearer <token>`.'
        expira_en:
          type: string
          format: date-time
    Credenciales:
      type: object
      description: Inicio de sesión con contraseña (RF-12).
      required:
        - identificador
        - contrasena
      properties:
        identificador:
          type: string
          description: El correo de la cuenta.
        contrasena:
          type: string
          maxLength: 128
    ParTokens:
      type: object
      description: |
        Lo que entrega un inicio de sesión de cuenta: los dos tokens de RF-12.

        El de acceso va firmado y se verifica sin tocar la base, que es lo que le
        permite sostener la ruta de lectura; el de refresco se canjea contra
        `plataforma.sesion` y ahí sí se comprueba si la sesión fue revocada (RF-25).
        De esa asimetría sale una consecuencia que conviene tener presente:
        revocar corta el refresco al instante y el acceso al vencer.
      required:
        - acceso
        - expira_en
        - refresco
        - refresco_expira_en
      properties:
        acceso:
          type: string
          description: 'Se manda en la cabecera `Authorization: Bearer <token>`.'
        expira_en:
          type: string
          format: date-time
        refresco:
          type: string
          description: |
            Se guarda y no se manda en cada petición. Rota en cada canje: el valor
            entregado deja de valer en cuanto se usa, de modo que si alguien lo
            copió, el primero de los dos en canjearlo deja al otro fuera y el robo
            se nota.
        refresco_expira_en:
          type: string
          format: date-time
    SolicitudEnlace:
      type: object
      description: |
        Magic link de RF-12: un enlace de un solo uso, quince minutos de vigencia.

        Responde igual exista o no la cuenta (RF-12 A12).
      required:
        - destino
      properties:
        destino:
          type: string
          format: email
    CanjeEnlace:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: El valor que viaja en el enlace recibido por correo.
    SolicitudRefresco:
      type: object
      required:
        - refresco
      properties:
        refresco:
          type: string
    Sesion:
      type: object
      description: Una sesión activa, tal como la lista RF-25.
      required:
        - id
        - ultimo_acceso
        - creada_en
        - expira_en
        - actual
      properties:
        id:
          type: string
          format: uuid
        dispositivo:
          type: string
        ip:
          type: string
        ultimo_acceso:
          type: string
          format: date-time
        creada_en:
          type: string
          format: date-time
        expira_en:
          type: string
          format: date-time
        actual:
          type: boolean
          description: |
            Si es la sesión desde la que se está mirando. Sin esto, "cerrar sesión
            en el otro dispositivo" obliga a adivinar cuál de las dos filas es la
            propia.
    ListaSesiones:
      type: object
      required:
        - datos
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Sesion'
    NuevaCuenta:
      type: object
      description: |
        Registro de RF-24.

        Responde `202` exista o no ya ese correo, y nunca dice cuál de los dos casos
        fue (RF-24, y el mismo criterio de RF-12 A12). Distinguirlos convertiría el
        formulario de alta en un comprobador de direcciones registradas.
      required:
        - nombre
        - contrasena
        - acepta_terminos
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
        telefono:
          type: string
          pattern: ^\+[1-9][0-9]{7,14}$
          description: E.164. Se guarda normalizado; el formato para mostrar es del cliente.
        contrasena:
          type: string
          minLength: 12
          maxLength: 128
          description: |
            La política de seguridad la comprueba el servidor y devuelve un `422`
            con el motivo por campo si no se cumple. La longitud mínima está aquí
            además de allí para que el cliente pueda avisar antes de enviar.
        acepta_terminos:
          type: boolean
          description: |
            RF-24 lo exige explícitamente. Un `false` es un `422`, no un `400`: la
            petición está bien formada, lo que falta es un requisito del negocio.
    TipoCuenta:
      type: string
      description: |
        Los tres de RF-23. NO se asigna: `administrador` se deriva de ser dueño de
        un tenant (RF-35) y `super_admin` es el operador de la plataforma. Una
        cuenta que se registra por la vía normal es siempre `usuario`.
      enum:
        - usuario
        - administrador
        - super_admin
    EstadoCuenta:
      type: string
      enum:
        - pendiente_verificacion
        - activa
        - suspendida
        - eliminada
    Cuenta:
      type: object
      description: El perfil de RF-22, tal como lo ve su propio dueño.
      required:
        - id
        - tipo
        - estado
        - email_verificado
        - telefono_verificado
        - creada_en
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        email:
          type: string
          format: email
        telefono:
          type: string
        email_verificado:
          type: boolean
        telefono_verificado:
          type: boolean
        tipo:
          $ref: '#/components/schemas/TipoCuenta'
        tenant_id:
          type: string
          format: uuid
          description: |
            Solo en un `administrador`, y significa "administra este negocio", NO
            "reserva en él". Un `usuario` no lo lleva aunque tenga reservas en
            veinte tenants distintos.
        estado:
          $ref: '#/components/schemas/EstadoCuenta'
        creada_en:
          type: string
          format: date-time
    ActualizacionCuenta:
      type: object
      description: |
        RF-22. Todo opcional: se envía lo que cambia.

        Cambiar el correo o el teléfono lo marca como NO verificado y dispara la
        verificación de RF-19. Es lo que impide que apuntar la cuenta a una
        dirección ajena baste para recibir los avisos de otra persona.
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
        telefono:
          type: string
          pattern: ^\+[1-9][0-9]{7,14}$
    CanalNotificacion:
      type: string
      description: |
        Los tres canales de RF-21. Es una lista más larga que `CanalContacto` a
        propósito: un push sirve para avisar, no para transportar un código de un
        solo uso.
      enum:
        - email
        - sms
        - push
    Preferencia:
      type: object
      description: |
        Una fila de RF-21: este canal, para este tipo de aviso, habilitado o no.

        Lo que no aparece en la lista NO está deshabilitado: está en el valor por
        defecto del producto. Es la diferencia que permite que activar un tipo nuevo
        alcance a quien nunca tocó esta pantalla.
      required:
        - canal
        - tipo
        - habilitado
      properties:
        canal:
          $ref: '#/components/schemas/CanalNotificacion'
        tipo:
          type: string
          minLength: 1
          maxLength: 64
          examples:
            - recordatorio
        habilitado:
          type: boolean
    ListaPreferencias:
      type: object
      required:
        - datos
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Preferencia'
    CanalContacto:
      type: string
      description: Por dónde viaja un código o un enlace de un solo uso.
      enum:
        - email
        - sms
    SolicitudVerificacion:
      type: object
      description: RF-19. Reenvía la verificación del contacto indicado.
      required:
        - canal
      properties:
        canal:
          $ref: '#/components/schemas/CanalContacto'
    CanjeVerificacion:
      type: object
      description: |
        RF-19. Un solo valor para los dos canales: el enlace del correo trae un
        token largo y el SMS trae seis dígitos, pero desde aquí ambos son "lo que
        llegó al canal", y separarlos en dos campos obligaría a decidir cuál de los
        dos se está usando en una petición que ya lo dice por el valor.
      required:
        - valor
      properties:
        valor:
          type: string
    CambioContrasena:
      type: object
      description: |
        El camino de RF-18 para quien ya entró: la prueba de identidad es la
        contraseña actual, y se exige aunque haya sesión. Un token robado no debe
        bastar para quedarse con la cuenta cambiando su contraseña.

        Se invalidan las demás sesiones, no la que hace el cambio: aquí quien lo
        pide ya demostró saber la contraseña anterior, así que echarlo de su propia
        sesión sería castigar el gesto correcto.
      required:
        - contrasena_actual
        - contrasena_nueva
      properties:
        contrasena_actual:
          type: string
          maxLength: 128
        contrasena_nueva:
          type: string
          minLength: 12
          maxLength: 128
    Restablecimiento:
      type: object
      description: |
        El camino de RF-18 para quien NO puede entrar: la prueba de identidad es el
        enlace que recibió por correo.

        Se invalidan todas las sesiones activas (RF-18). Una contraseña se
        restablece justamente cuando se sospecha que alguien más la tiene, y dejar
        vivas las sesiones abiertas con la anterior vaciaría el gesto.
      required:
        - token
        - contrasena_nueva
      properties:
        token:
          type: string
          description: El valor que viaja en el enlace de recuperación.
        contrasena_nueva:
          type: string
          minLength: 12
          maxLength: 128
    SolicitudRecuperacion:
      type: object
      description: |
        RF-18. Responde igual exista o no la cuenta y no envía nada si no existe.
      required:
        - destino
      properties:
        destino:
          type: string
          format: email
    AccionAgente:
      type: string
      description: |
        Las acciones que un token de agente puede autorizar. Es un enum cerrado y no
        texto libre: el alcance de RF-13 se calcula intersecando esta lista con la
        de la cuenta impersonada, y una acción que nadie sabe interpretar no se
        puede intersecar con nada, solo aceptar de más.
      enum:
        - reservar
        - listar_reservas
        - cancelar_reserva
    IntercambioAgente:
      type: object
      description: |
        El intercambio de RF-13: credencial del agente + cuenta sobre la que quiere
        actuar + acciones que pide.

        Las tres condiciones se comprueban por separado y las tres devuelven lo
        mismo (`403`): que el agente exista y esté activo, que esa cuenta lo haya
        autorizado (RNF-07) y que las acciones estén dentro del alcance de esa
        cuenta (RF-23). Distinguirlas en la respuesta le diría a quien prueba
        credenciales qué parte acertó.
      required:
        - credencial
        - cuenta_id
        - acciones
      properties:
        credencial:
          type: string
          minLength: 32
          maxLength: 256
        cuenta_id:
          type: string
          format: uuid
          description: La cuenta en cuyo nombre se va a actuar.
        acciones:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AccionAgente'
    TokenAgente:
      type: object
      description: |
        El token de validación de RF-13: vigencia corta y un solo propósito.

        Devuelve el alcance CONCEDIDO, que puede ser menor que el pedido. Es
        información que el agente necesita: sin ella, la única forma de descubrir
        que una acción quedó fuera es intentarla y recibir un rechazo delante de la
        persona a la que está atendiendo.
      required:
        - token
        - expira_en
        - alcance
      properties:
        token:
          type: string
        expira_en:
          type: string
          format: date-time
        alcance:
          type: array
          items:
            $ref: '#/components/schemas/AccionAgente'
        cuenta_impersonada_id:
          type: string
          format: uuid
    EstadoReserva:
      type: string
      description: Estados de RF-28.
      enum:
        - pendiente
        - confirmada
        - en_curso
        - completada
        - cancelada
        - no_show
        - expirada
    Contacto:
      type: object
      required:
        - nombre
        - email
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
        telefono:
          type: string
    Reserva:
      type: object
      required:
        - id
        - servicio_id
        - recurso_id
        - periodo
        - estado
        - precio_cobrado
        - creada_en
      properties:
        id:
          type: string
          format: uuid
        servicio_id:
          type: string
          format: uuid
        recurso_id:
          type: string
          format: uuid
        periodo:
          $ref: '#/components/schemas/Periodo'
        estado:
          $ref: '#/components/schemas/EstadoReserva'
        precio_cobrado:
          $ref: '#/components/schemas/Dinero'
        contacto:
          $ref: '#/components/schemas/Contacto'
        expira_en:
          type: string
          format: date-time
          description: |
            Solo mientras el estado es `pendiente`. Pasado ese instante el cupo
            puede liberarse (RF-27).
        creada_en:
          type: string
          format: date-time
    ListaReservas:
      type: object
      required:
        - datos
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Reserva'
        siguiente_cursor:
          type: string
          description: Ausente cuando no hay más páginas.
    NuevaReserva:
      type: object
      required:
        - servicio_id
        - recurso_id
        - periodo
        - contacto
      properties:
        servicio_id:
          type: string
          format: uuid
        recurso_id:
          type: string
          format: uuid
        periodo:
          $ref: '#/components/schemas/Periodo'
        contacto:
          $ref: '#/components/schemas/Contacto'
        voucher_codigo:
          type: string
          description: Código de descuento, si aplica (RF-08).
    ReservaCreada:
      type: object
      description: |
        Lo que devuelve la ruta crítica: la reserva ya con el cupo garantizado, más
        el secreto que el cliente necesita para confirmar el pago contra Stripe
        directamente, sin que el importe pase por este backend.
      required:
        - reserva
      properties:
        reserva:
          $ref: '#/components/schemas/Reserva'
        pago_client_secret:
          type: string
          description: '`client_secret` del PaymentIntent de Stripe.'
  responses:
    PeticionInvalida:
      description: La petición está mal formada
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    ErrorInterno:
      description: Error no previsto
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    NoEncontrado:
      description: |
        No existe. Bajo RLS, "no existe" y "existe pero es de otro tenant" son
        indistinguibles, y así debe ser: distinguirlos filtraría la existencia de
        datos ajenos.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    DemasiadasPeticiones:
      description: Se superó la cuota de la cuenta o del agente (RNF-08)
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    NoAutorizado:
      description: |
        Falta el token de acceso, o ya no vale. No distingue entre "no lo mandaste"
        y "el que mandaste está mal": para quien prueba tokens, saber cuál de las
        dos cosas falló es la mitad del trabajo hecho.

        El vencimiento SÍ se distingue en el `type` del problema, y no es una
        contradicción: caducar no es un fallo de quien lo presenta, es el
        funcionamiento normal, y la interfaz tiene que poder decir "vuelve a
        identificarte" en vez de "no eres tú".
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    NoProcesable:
      description: Sintácticamente válida pero viola una regla de negocio
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    FueraDeAlcance:
      description: |
        La identificación es válida pero el recurso queda fuera del alcance de esa
        cuenta (RF-23).

        Se distingue del 401 a propósito: un 401 dice "no sé quién eres" y la
        interfaz responde pidiendo identificarse otra vez, cosa que aquí no
        arreglaría nada. Y no sustituye al 404 de un recurso ajeno: cuando decir
        "existe pero no es tuyo" ya filtra la existencia del recurso, la respuesta
        correcta sigue siendo 404. Este 403 es para las acciones cuyo alcance no
        depende de un identificador que haya que adivinar.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
