openapi: 3.1.0
info:
  title: API de reservas
  version: 0.1.0
  description: |
    Contrato único entre el backend en Go y el frontend en React. Los tipos de
    ambos lados se generan desde aquí, así que este archivo es la fuente de
    verdad: un cambio que rompa el contrato rompe la compilación de los dos, en
    vez de aparecer como un fallo en tiempo de ejecución.

    Solo cubre la rebanada inicial —catálogo, disponibilidad y creación de
    reservas—. El resto de los RF se añaden a medida que se implementan.
servers:
  - url: http://localhost:8080
    description: Desarrollo local
tags:
  - name: catalogo
    description: Sedes y servicios (RF-26)
  - name: disponibilidad
    description: Consulta de horarios libres (RF-26)
  - name: reservas
    description: Creación y consulta de reservas (RF-01, RF-02, RF-03, RF-06)
  - name: sesiones
    description: Identificación del cliente por código de un solo uso (RF-02)
paths:
  /v1/sedes:
    get:
      operationId: listarSedes
      security: []
      summary: Sedes del tenant
      tags:
        - catalogo
      parameters:
        - $ref: '#/components/parameters/Tenant'
      responses:
        '200':
          description: Listado de sedes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaSedes'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /v1/servicios:
    get:
      operationId: listarServicios
      security: []
      summary: Servicios ofrecidos, opcionalmente filtrados por sede
      tags:
        - catalogo
      parameters:
        - $ref: '#/components/parameters/Tenant'
        - name: sede_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Listado de servicios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaServicios'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /v1/disponibilidad:
    get:
      operationId: consultarDisponibilidad
      security: []
      summary: Franjas libres de un servicio en un rango
      description: |
        Sirve el 90% del tráfico (RNF-03) desde caché, con los 2 s de
        desactualización que RNF-10 autoriza.

        La lectura es optimista a propósito: puede devolver una franja que otro
        cliente acaba de tomar. Quien decide es el núcleo al insertar, contra la
        restricción EXCLUDE (flujo alternativo 3 de RF-01). Un cliente que trate
        esta respuesta como una reserva garantizada está mal escrito.
      tags:
        - disponibilidad
      parameters:
        - $ref: '#/components/parameters/Tenant'
        - name: servicio_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: desde
          in: query
          required: true
          description: Instante inicial, inclusive.
          schema:
            type: string
            format: date-time
        - name: hasta
          in: query
          required: true
          description: Instante final, exclusive.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Franjas libres
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Disponibilidad'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /v1/sesiones/codigo:
    post:
      operationId: solicitarCodigo
      security: []
      summary: Pedir un código para ver las reservas propias
      description: |
        Manda un código de seis dígitos al correo indicado (RF-02, con los
        parámetros de RF-19: seis dígitos, vigencia corta, un solo uso).

        **Responde igual exista o no ese correo** (RF-12 A12). Distinguirlos
        permitiría enumerar quién ha reservado en el negocio probando direcciones.

        Pedir un código nuevo invalida el anterior del mismo destino: tres códigos
        vivos a la vez triplicarían lo que puede adivinar quien los esté probando.
      tags:
        - sesiones
      parameters:
        - $ref: '#/components/parameters/Tenant'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudCodigo'
      responses:
        '202':
          description: |
            Aceptado. NO significa que el correo exista ni que se haya entregado
            nada: significa que si existe, el código va en camino. Es un 202 y no
            un 200 justamente porque no se puede afirmar el resultado sin
            filtrarlo.
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /v1/sesiones/token:
    post:
      operationId: canjearCodigo
      security: []
      summary: Canjear el código por un token de acceso
      tags:
        - sesiones
      parameters:
        - $ref: '#/components/parameters/Tenant'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CanjeCodigo'
      responses:
        '200':
          description: Código correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenAcceso'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          description: |
            El código no vale: equivocado, caducado, ya usado o inexistente. Los
            cuatro casos responden igual, porque cada distinción le diría a quien
            esté probando códigos si va por buen camino.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /v1/reservas:
    get:
      operationId: listarReservas
      summary: Reservas de quien pide (RF-02, filtros de RF-09)
      description: |
        El alcance NO es fijo: sale de quién presenta el token (RF-23). Hoy solo
        existe el token de invitado, así que devuelve las reservas hechas con el
        correo que ese token acredita.

        Cuando exista RF-12, la misma ruta devolverá las de la cuenta a un
        `usuario` y las del tenant a un `administrador` (RF-32). Es una operación
        con el alcance acotado por la cuenta, no tres rutas distintas por rol.
      tags:
        - reservas
      security:
        - TokenCliente: []
      parameters:
        - $ref: '#/components/parameters/Tenant'
        - name: estado
          in: query
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/EstadoReserva'
          style: form
          explode: false
        - name: desde
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: hasta
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: limite
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: |
            Cursor opaco de la página siguiente. Paginación por cursor y no por
            desplazamiento: con OFFSET, insertar una fila mientras se pagina
            desplaza el resto y el cliente ve duplicados o se salta filas.
          schema:
            type: string
      responses:
        '200':
          description: Página de reservas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaReservas'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    post:
      operationId: crearReserva
      security: []
      summary: Crear una reserva (RF-01)
      description: |
        Ruta crítica de RNF-01: presupuesto de 200 ms. Devuelve una reserva
        **pendiente** con el cupo ya garantizado, sin esperar a que el pago se
        confirme. La confirmación llega después por el webhook de Stripe (RF-33),
        fuera de este presupuesto.

        La reserva pendiente caduca en `expira_en`. Si el pago no llega antes, un
        trabajador la marca expirada y libera el cupo (RF-27).
      tags:
        - reservas
      parameters:
        - $ref: '#/components/parameters/Tenant'
        - name: Idempotency-Key
          in: header
          required: true
          description: |
            Clave única de la operación. Obligatoria, no opcional: un agente que
            reintenta un POST tras un timeout crearía dos bloqueos que nadie
            libera hasta el TTL. Repetir la misma clave devuelve la reserva ya
            creada en vez de crear otra.
          schema:
            type: string
            minLength: 8
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevaReserva'
      responses:
        '201':
          description: Reserva creada, pendiente de pago
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaCreada'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: |
            El horario ya está tomado. Es la respuesta al rechazo de la
            restricción EXCLUDE por otra transacción concurrente: no es un error
            del cliente ni del servidor, es el resultado normal de perder una
            carrera por el mismo cupo.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '422':
          $ref: '#/components/responses/NoProcesable'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /v1/reservas/{id}:
    get:
      operationId: obtenerReserva
      summary: Detalle de una reserva (RF-03)
      description: |
        Una reserva que existe pero es de otra persona responde `404`, no `403`.
        Un 403 confirmaría que esa reserva existe, y con identificadores ajenos
        eso permite comprobar cuáles son reales.
      tags:
        - reservas
      security:
        - TokenCliente: []
      parameters:
        - $ref: '#/components/parameters/Tenant'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: La reserva
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /v1/reservas/{id}/cancelacion:
    post:
      operationId: cancelarReserva
      summary: Cancelar una reserva (RF-06)
      description: |
        Aplica la política que la reserva congeló al crearse, no la vigente hoy
        (RF-15). Es lo que impide que un negocio endurezca su política el martes y
        se la aplique a quien reservó el lunes bajo otras condiciones.

        Fuera del plazo de cancelación responde `422` con lo que faltaba, no un
        `403`: no es una cuestión de permisos, es que la regla del negocio no lo
        permite en ese momento.

        El reembolso NO ocurre aquí. Se dispara aparte (RF-29) y por eso la
        respuesta no dice nada del dinero: prometerlo en esta respuesta sería
        afirmar algo que este componente no puede garantizar.
      tags:
        - reservas
      security:
        - TokenCliente: []
      parameters:
        - $ref: '#/components/parameters/Tenant'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: La reserva, ya cancelada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: |
            La reserva ya no está en un estado que se pueda cancelar: ya estaba
            cancelada, ya se completó, o el bloqueo expiró solo.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '422':
          $ref: '#/components/responses/NoProcesable'
        '500':
          $ref: '#/components/responses/ErrorInterno'
components:
  securitySchemes:
    TokenCliente:
      type: http
      scheme: bearer
      description: |
        El token que devuelve `POST /v1/sesiones/token` tras acertar el código.

        Acredita UNA cosa: que quien lo presenta controla ese correo. No hay
        cuenta detrás, así que tampoco hay roles: el alcance es exactamente las
        reservas hechas con esa dirección. Cuando exista RF-12, el mismo
        encabezado transportará tokens de cuenta y el alcance saldrá del tipo
        de cuenta (RF-23).

        Es de vigencia corta y no se puede revocar. Un invitado no tiene sesión
        que gestionar (RF-25 es de cuentas), así que caducar pronto es la única
        defensa que tiene.
  parameters:
    Tenant:
      name: X-Tenant-Id
      in: header
      required: true
      description: |
        Tenant sobre el que se opera. Provisional: en cuanto exista autenticación
        (RF-12) el tenant se deriva del token y esta cabecera desaparece. Aceptarla
        de un cliente en producción permitiría leer los datos de cualquier otro
        tenant.
      schema:
        type: string
        format: uuid
  schemas:
    EstadoCatalogo:
      type: string
      enum:
        - activo
        - inactivo
    Sede:
      type: object
      required:
        - id
        - nombre
        - zona_horaria
        - estado
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        zona_horaria:
          type: string
          description: |
            Identificador IANA. Se guarda por sede y no global porque un tenant
            puede operar en varias zonas (RF-38), y una franja horaria sin zona es
            ambigua dos veces al año.
          examples:
            - America/Bogota
        direccion:
          type: string
        estado:
          $ref: '#/components/schemas/EstadoCatalogo'
    ListaSedes:
      type: object
      required:
        - datos
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Sede'
    Problema:
      type: object
      description: |
        Formato de error único de la API, según RFC 9457 (problem details). Se usa
        un estándar en vez de un formato propio para que el cliente pueda tratar los
        errores de forma uniforme y para que una respuesta de error sea
        indistinguible venga del componente de ARQ-01 que venga.
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          description: Identificador estable del tipo de problema.
          examples:
            - https://api.reservas/errores/horario-ocupado
        title:
          type: string
          description: Resumen legible, constante para un mismo type.
        status:
          type: integer
          description: Código HTTP, repetido en el cuerpo.
        detail:
          type: string
          description: Explicación concreta de esta ocurrencia.
        instance:
          type: string
          description: Identificador de la petición, para cruzar con las trazas.
        errores:
          type: array
          description: Detalle por campo, cuando el problema es de validación.
          items:
            type: object
            required:
              - campo
              - mensaje
            properties:
              campo:
                type: string
              mensaje:
                type: string
    Dinero:
      type: object
      description: |
        El monto va como cadena decimal, no como número. En JSON los números son de
        coma flotante y 80000.10 no se representa exactamente; con dinero eso acaba
        en un céntimo de diferencia entre lo que se cobra y lo que se muestra. La
        columna del esquema es `numeric`, que sí es exacta, y una cadena la preserva
        de extremo a extremo.
      required:
        - monto
        - moneda
      properties:
        monto:
          type: string
          pattern: ^-?\d+(\.\d{1,4})?$
          examples:
            - '80000.00'
        moneda:
          type: string
          minLength: 3
          maxLength: 3
          description: Código ISO 4217.
          examples:
            - COP
    Servicio:
      type: object
      required:
        - id
        - sede_id
        - nombre
        - duracion_min
        - precio
        - estado
      properties:
        id:
          type: string
          format: uuid
        sede_id:
          type: string
          format: uuid
        nombre:
          type: string
        descripcion:
          type: string
        duracion_min:
          type: integer
          minimum: 1
          description: Duración en minutos.
        precio:
          $ref: '#/components/schemas/Dinero'
        estado:
          $ref: '#/components/schemas/EstadoCatalogo'
    ListaServicios:
      type: object
      required:
        - datos
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Servicio'
    Periodo:
      type: object
      description: |
        Intervalo semiabierto `[inicio, fin)`. El límite inferior entra, el superior
        no.

        No es un detalle de estilo: con ambos límites cerrados, 10:00–11:00 y
        11:00–12:00 comparten un instante, el operador `&&` de PostgreSQL las declara
        solapadas y la restricción EXCLUDE rechazaría dos citas consecutivas
        perfectamente válidas.
      required:
        - inicio
        - fin
      properties:
        inicio:
          type: string
          format: date-time
        fin:
          type: string
          format: date-time
    Franja:
      type: object
      required:
        - periodo
        - recurso_id
      properties:
        periodo:
          $ref: '#/components/schemas/Periodo'
        recurso_id:
          type: string
          format: uuid
    Disponibilidad:
      type: object
      required:
        - servicio_id
        - franjas
        - calculada_en
      properties:
        servicio_id:
          type: string
          format: uuid
        franjas:
          type: array
          items:
            $ref: '#/components/schemas/Franja'
        calculada_en:
          type: string
          format: date-time
          description: |
            Cuándo se calculó esta vista. El cliente puede saber así cuánta
            desactualización está viendo, dentro de los 2 s que RNF-10 permite.
    SolicitudCodigo:
      type: object
      description: |
        Pide un código al correo con el que se reservó.

        La respuesta es SIEMPRE la misma exista o no ese correo (RF-12 A12). Una
        respuesta que los distinguiera convertiría esta ruta en un buscador de
        clientes del negocio: se prueban direcciones y las que contesten distinto
        son las que reservaron.
      required:
        - destino
      properties:
        destino:
          type: string
          format: email
          description: El correo con el que se hizo la reserva.
          examples:
            - ana@ejemplo.test
    CanjeCodigo:
      type: object
      required:
        - destino
        - codigo
      properties:
        destino:
          type: string
          format: email
        codigo:
          type: string
          pattern: ^[0-9]{6}$
          description: |
            Los seis dígitos recibidos. Un solo uso y tres intentos (RF-12 A2):
            agotados, el código se quema y hay que pedir otro.
          examples:
            - '042317'
    TokenAcceso:
      type: object
      description: |
        Lo que se entrega al acertar el código.

        Es de vigencia corta y no se puede revocar: un invitado no tiene sesión que
        gestionar, así que la única defensa de este token es que caduque pronto. Por
        eso viaja `expira_en`: la interfaz puede pedir que se identifique otra vez
        ANTES de que falle una petición, en vez de después.
      required:
        - token
        - expira_en
      properties:
        token:
          type: string
          description: 'Se manda en la cabecera `Authorization: Bearer <token>`.'
        expira_en:
          type: string
          format: date-time
    EstadoReserva:
      type: string
      description: Estados de RF-28.
      enum:
        - pendiente
        - confirmada
        - en_curso
        - completada
        - cancelada
        - no_show
        - expirada
    Contacto:
      type: object
      required:
        - nombre
        - email
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
        telefono:
          type: string
    Reserva:
      type: object
      required:
        - id
        - servicio_id
        - recurso_id
        - periodo
        - estado
        - precio_cobrado
        - creada_en
      properties:
        id:
          type: string
          format: uuid
        servicio_id:
          type: string
          format: uuid
        recurso_id:
          type: string
          format: uuid
        periodo:
          $ref: '#/components/schemas/Periodo'
        estado:
          $ref: '#/components/schemas/EstadoReserva'
        precio_cobrado:
          $ref: '#/components/schemas/Dinero'
        contacto:
          $ref: '#/components/schemas/Contacto'
        expira_en:
          type: string
          format: date-time
          description: |
            Solo mientras el estado es `pendiente`. Pasado ese instante el cupo
            puede liberarse (RF-27).
        creada_en:
          type: string
          format: date-time
    ListaReservas:
      type: object
      required:
        - datos
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Reserva'
        siguiente_cursor:
          type: string
          description: Ausente cuando no hay más páginas.
    NuevaReserva:
      type: object
      required:
        - servicio_id
        - recurso_id
        - periodo
        - contacto
      properties:
        servicio_id:
          type: string
          format: uuid
        recurso_id:
          type: string
          format: uuid
        periodo:
          $ref: '#/components/schemas/Periodo'
        contacto:
          $ref: '#/components/schemas/Contacto'
        voucher_codigo:
          type: string
          description: Código de descuento, si aplica (RF-08).
    ReservaCreada:
      type: object
      description: |
        Lo que devuelve la ruta crítica: la reserva ya con el cupo garantizado, más
        el secreto que el cliente necesita para confirmar el pago contra Stripe
        directamente, sin que el importe pase por este backend.
      required:
        - reserva
      properties:
        reserva:
          $ref: '#/components/schemas/Reserva'
        pago_client_secret:
          type: string
          description: '`client_secret` del PaymentIntent de Stripe.'
  responses:
    PeticionInvalida:
      description: La petición está mal formada
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    ErrorInterno:
      description: Error no previsto
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    NoEncontrado:
      description: |
        No existe. Bajo RLS, "no existe" y "existe pero es de otro tenant" son
        indistinguibles, y así debe ser: distinguirlos filtraría la existencia de
        datos ajenos.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    DemasiadasPeticiones:
      description: Se superó la cuota de la cuenta o del agente (RNF-08)
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    NoAutorizado:
      description: |
        Falta el token de acceso, o ya no vale. No distingue entre "no lo mandaste"
        y "el que mandaste está mal": para quien prueba tokens, saber cuál de las
        dos cosas falló es la mitad del trabajo hecho.

        El vencimiento SÍ se distingue en el `type` del problema, y no es una
        contradicción: caducar no es un fallo de quien lo presenta, es el
        funcionamiento normal, y la interfaz tiene que poder decir "vuelve a
        identificarte" en vez de "no eres tú".
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    NoProcesable:
      description: Sintácticamente válida pero viola una regla de negocio
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
