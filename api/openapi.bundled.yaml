  /v1/reservas:
    get:
      operationId: listarReservas
      summary: Reservas de quien pide (RF-02, filtros de RF-09)
      description: |
        El alcance NO es fijo: sale de quién presenta el token (RF-23). Hoy solo
        existe el token de invitado, así que devuelve las reservas hechas con el
        correo que ese token acredita.

        Con un token de cuenta el alcance sale del tipo (RF-23): un `usuario` ve
        las suyas, un `administrador` ve las de su tenant (RF-32) y un agente, las
        de la cuenta que representa (RF-05). Es una operación con el alcance
        acotado por la cuenta, no cuatro rutas distintas por rol.

        Los filtros `sede_id` y `recurso_id` solo tienen sentido en el alcance del
        administrador —la agenda de RF-32 se recorre por sede y por recurso— pero
        no se rechazan a un `usuario`: acotar lo propio por sede es una consulta
        legítima, y prohibirla obligaría a que el filtro supiera de roles.
      tags:
        - reservas
      security:
        - TokenCliente: []
      parameters:
        - $ref: '#/components/parameters/Tenant'
        - name: estado
          in: query
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/EstadoReserva'
          style: form
          explode: false
        - name: desde
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: hasta
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: sede_id
          in: query
          required: false
          description: Agenda de una sede (RF-32).
          schema:
            type: string
            format: uuid
        - name: recurso_id
          in: query
          required: false
          description: Agenda de un recurso concreto (RF-32).
          schema:
            type: string
            format: uuid
        - name: limite
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: |
            Cursor opaco de la página siguiente. Paginación por cursor y no por
            desplazamiento: con OFFSET, insertar una fila mientras se pagina
            desplaza el resto y el cliente ve duplicados o se salta filas.
          schema:
            type: string
      responses:
        '200':
          description: Página de reservas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaReservas'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/FueraDeAlcance'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    post:
      operationId: crearReserva
      security: []
      summary: Crear una reserva (RF-01)
      description: |
        Ruta crítica de RNF-01: presupuesto de 200 ms. Devuelve una reserva
        **pendiente** con el cupo ya garantizado, sin esperar a que el pago se
        confirme. La confirmación llega después por el webhook de Stripe (RF-33),
        fuera de este presupuesto.

        La reserva pendiente caduca en `expira_en`. Si el pago no llega antes, un
        trabajador la marca expirada y libera el cupo (RF-27).
      tags:
        - reservas
      parameters:
        - $ref: '#/components/parameters/Tenant'
        - name: Idempotency-Key
          in: header
          required: true
          description: |
            Clave única de la operación. Obligatoria, no opcional: un agente que
            reintenta un POST tras un timeout crearía dos bloqueos que nadie
            libera hasta el TTL. Repetir la misma clave devuelve la reserva ya
            creada en vez de crear otra.
          schema:
            type: string
            minLength: 8
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevaReserva'
      responses:
        '201':
          description: Reserva creada, pendiente de pago
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaCreada'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: |
            El horario ya está tomado. Es la respuesta al rechazo de la
            restricción EXCLUDE por otra transacción concurrente: no es un error
            del cliente ni del servidor, es el resultado normal de perder una
            carrera por el mismo cupo.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '422':
          $ref: '#/components/responses/NoProcesable'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /v1/reservas/{id}:
    get:
      operationId: obtenerReserva
      summary: Detalle de una reserva (RF-03)
      description: |
        Una reserva que existe pero es de otra persona responde `404`, no `403`.
        Un 403 confirmaría que esa reserva existe, y con identificadores ajenos
        eso permite comprobar cuáles son reales.
      tags:
        - reservas
      security:
        - TokenCliente: []
      parameters:
        - $ref: '#/components/parameters/Tenant'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: La reserva
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /v1/reservas/{id}/cancelacion:
    post:
      operationId: cancelarReserva
      summary: Cancelar una reserva (RF-06)
      description: |
        Aplica la política que la reserva congeló al crearse, no la vigente hoy
        (RF-15). Es lo que impide que un negocio endurezca su política el martes y
        se la aplique a quien reservó el lunes bajo otras condiciones.

        Fuera del plazo de cancelación responde `422` con lo que faltaba, no un
        `403`: no es una cuestión de permisos, es que la regla del negocio no lo
        permite en ese momento.

        El reembolso NO ocurre aquí. Se dispara aparte (RF-29) y por eso la
        respuesta no dice nada del dinero: prometerlo en esta respuesta sería
        afirmar algo que este componente no puede garantizar.
      tags:
        - reservas
      security:
        - TokenCliente: []
      parameters:
        - $ref: '#/components/parameters/Tenant'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: La reserva, ya cancelada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: |
            La reserva ya no está en un estado que se pueda cancelar: ya estaba
            cancelada, ya se completó, o el bloqueo expiró solo.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '422':
          $ref: '#/components/responses/NoProcesable'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /v1/reservas/{id}/modificacion:
    post:
      operationId: modificarReserva
      summary: Reprogramar una reserva (RF-07)
      description: |
        Mueve la MISMA reserva a otra hora, y opcionalmente a otro recurso. El
        cupo viejo se libera y el nuevo se toma en la misma transacción, así que
        no hay un instante en el que la persona se quede sin nada: cancelar y
        volver a reservar sí lo tendría, y en él otro cliente puede llevarse el
        horario.

        Aplica el `rango_modificacion_horas` de la política que la reserva congeló
        al crearse (RF-15), no la vigente hoy. Fuera de ese plazo responde `422`
        con lo que faltaba, no un `403`: no es una cuestión de permisos, es que la
        regla del negocio no lo permite en ese momento. Un administrador sobre su
        propio tenant no lo tiene, por lo mismo que en la cancelación.

        El `409` es el de siempre: la restricción EXCLUDE rechazando el horario
        nuevo porque otro se lo quedó.
      tags:
        - reservas
      security:
        - TokenCliente: []
      parameters:
        - $ref: '#/components/parameters/Tenant'
        - $ref: '#/components/parameters/IdEnRuta'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModificacionReserva'
      responses:
        '200':
          description: La reserva, ya movida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: |
            El horario nuevo ya está tomado, o la reserva ya no está en un estado
            desde el que se pueda mover.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '422':
          $ref: '#/components/responses/NoProcesable'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /v1/reservas/{id}/estado:
    post:
      operationId: cambiarEstadoReserva
      summary: Registrar una transición manual (RF-28, RF-32)
      description: |
        El check-in, la ausencia y el cierre de una cita: las tres transiciones
        que la leyenda de RF-28 asigna a una persona y no al sistema.

        Es del administrador del tenant. Cancelar NO entra aquí aunque sea una
        transición: libera cupo y aplica una política, así que tiene su propia
        ruta y su propio 422.
      tags:
        - reservas
      security:
        - TokenCliente: []
      parameters:
        - $ref: '#/components/parameters/Tenant'
        - $ref: '#/components/parameters/IdEnRuta'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambioEstado'
      responses:
        '200':
          description: La reserva, ya en el estado nuevo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/FueraDeAlcance'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: |
            Esa transición no sale del estado actual. La respuesta dice en cuál
            está: sin eso, la agenda tendría que adivinar por qué su botón no hizo
            nada.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /v1/reservas/{id}/calificacion:
    post:
      operationId: calificarReserva
      summary: Calificar una reserva completada (RF-20)
      description: |
        Una por reserva, y solo sobre una completada. Las dos reglas están en
        sitios distintos a propósito: la unicidad la sostiene el motor —es la que
        se ataca desde fuera— y "solo completada" vive en el núcleo, porque exige
        mirar el estado y no cabe en un CHECK.

        Una reserva ajena responde `404`, igual que una inexistente.
      tags:
        - reservas
      security:
        - TokenCliente: []
      parameters:
        - $ref: '#/components/parameters/Tenant'
        - $ref: '#/components/parameters/IdEnRuta'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevaCalificacion'
      responses:
        '201':
          description: La calificación registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Calificacion'
        '400':
          $ref: '#/components/responses/PeticionInvalida'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: Esa reserva ya tiene una calificación.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '422':
          $ref: '#/components/responses/NoProcesable'
        '500':
          $ref: '#/components/responses/ErrorInterno'
components:
  securitySchemes:
    TokenCliente:
      type: http
      scheme: bearer
      description: |
        Un solo encabezado para tres portadores distintos, porque RF-23 modela
        el alcance como una propiedad de la cuenta y no de la ruta:

        - **Invitado** (`POST /v1/sesiones/token`): acredita que quien lo
          presenta controla ese correo. Sin cuenta detrás y sin roles: su
          alcance son exactamente las reservas hechas con esa dirección (RF-02).
        - **Cuenta** (`POST /v1/sesiones/contrasena`, `.../enlace/canje`,
          `.../refresco`): su alcance sale del tipo de cuenta (RF-23). Un
          `usuario` ve lo suyo, un `administrador` ve su tenant entero (RF-32).
        - **Agente** (`POST /v1/agentes/token`): actúa en nombre de una cuenta,
          con el alcance ya intersecado al emitirlo (RF-13). Nunca recibe más
          del que ya tiene la cuenta impersonada.

        Todos son de vigencia corta y ninguno se comprueba contra la base al
        verificarlo: es lo que le permite sostener la ruta de lectura de RNF-03.
        Lo que sí se revoca es la SESIÓN (RF-25), y corta el refresco al
        instante; el de acceso muere al vencer. La ventana de revocación es, por
        tanto, exactamente su vigencia.
  parameters:
    Tenant:
      name: X-Tenant-Id
      in: header
      required: true
      description: |
        Tenant sobre el que se opera. Provisional: en cuanto exista autenticación
        (RF-12) el tenant se deriva del token y esta cabecera desaparece. Aceptarla
        de un cliente en producción permitiría leer los datos de cualquier otro
        tenant.
      schema:
        type: string
        format: uuid
    IdEnRuta:
      name: id
      in: path
      required: true
      description: Identificador del recurso sobre el que se opera.
      schema:
        type: string
        format: uuid
  schemas:
    EstadoCatalogo:
      type: string
      enum:
        - activo
        - inactivo
    Sede:
      type: object
      required:
        - id
        - nombre
        - zona_horaria
        - estado
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        zona_horaria:
          type: string
          description: |
            Identificador IANA. Se guarda por sede y no global porque un tenant
            puede operar en varias zonas (RF-38), y una franja horaria sin zona es
            ambigua dos veces al año.
          examples:
            - America/Bogota
        direccion:
          type: string
        estado:
          $ref: '#/components/schemas/EstadoCatalogo'
    ListaSedes:
      type: object
      required:
        - datos
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Sede'
    Problema:
      type: object
      description: |
        Formato de error único de la API, según RFC 9457 (problem details). Se usa
        un estándar en vez de un formato propio para que el cliente pueda tratar los
        errores de forma uniforme y para que una respuesta de error sea
        indistinguible venga del componente de ARQ-01 que venga.
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          description: Identificador estable del tipo de problema.
          examples:
            - https://api.reservas/errores/horario-ocupado
        title:
          type: string
          description: Resumen legible, constante para un mismo type.
        status:
          type: integer
          description: Código HTTP, repetido en el cuerpo.
        detail:
          type: string
          description: Explicación concreta de esta ocurrencia.
        instance:
          type: string
          description: Identificador de la petición, para cruzar con las trazas.
        errores:
          type: array
          description: Detalle por campo, cuando el problema es de validación.
          items:
            type: object
            required:
              - campo
              - mensaje
            properties:
              campo:
                type: string
              mensaje:
                type: string
    Dinero:
      type: object
      description: |
        El monto va como cadena decimal, no como número. En JSON los números son de
        coma flotante y 80000.10 no se representa exactamente; con dinero eso acaba
        en un céntimo de diferencia entre lo que se cobra y lo que se muestra. La
        columna del esquema es `numeric`, que sí es exacta, y una cadena la preserva
        de extremo a extremo.
      required:
        - monto
        - moneda
      properties:
        monto:
          type: string
          pattern: ^-?\d+(\.\d{1,4})?$
          examples:
            - '80000.00'
        moneda:
          type: string
          minLength: 3
          maxLength: 3
          description: Código ISO 4217.
          examples:
            - COP
    Servicio:
      type: object
      required:
        - id
        - sede_id
        - nombre
        - duracion_min
        - precio
        - estado
      properties:
        id:
          type: string
          format: uuid
        sede_id:
          type: string
          format: uuid
        nombre:
          type: string
        descripcion:
          type: string
        duracion_min:
          type: integer
          minimum: 1
          description: Duración en minutos.
        precio:
          $ref: '#/components/schemas/Dinero'
        estado:
          $ref: '#/components/schemas/EstadoCatalogo'
    ListaServicios:
      type: object
      required:
        - datos
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Servicio'
    Periodo:
      type: object
      description: |
        Intervalo semiabierto `[inicio, fin)`. El límite inferior entra, el superior
        no.

        No es un detalle de estilo: con ambos límites cerrados, 10:00–11:00 y
        11:00–12:00 comparten un instante, el operador `&&` de PostgreSQL las declara
        solapadas y la restricción EXCLUDE rechazaría dos citas consecutivas
        perfectamente válidas.
      required:
        - inicio
        - fin
      properties:
        inicio:
          type: string
          format: date-time
        fin:
          type: string
          format: date-time
    Franja:
      type: object
      required:
        - periodo
        - recurso_id
      properties:
        periodo:
          $ref: '#/components/schemas/Periodo'
        recurso_id:
          type: string
          format: uuid
    Disponibilidad:
      type: object
      required:
        - servicio_id
        - franjas
        - calculada_en
      properties:
        servicio_id:
          type: string
          format: uuid
        franjas:
          type: array
          items:
            $ref: '#/components/schemas/Franja'
        calculada_en:
          type: string
          format: date-time
          description: |
            Cuándo se calculó esta vista. El cliente puede saber así cuánta
            desactualización está viendo, dentro de los 2 s que RNF-10 permite.
    SolicitudCodigo:
      type: object
      description: |
        Pide un código al correo con el que se reservó.

        La respuesta es SIEMPRE la misma exista o no ese correo (RF-12 A12). Una
        respuesta que los distinguiera convertiría esta ruta en un buscador de
        clientes del negocio: se prueban direcciones y las que contesten distinto
        son las que reservaron.
      required:
        - destino
      properties:
        destino:
          type: string
          format: email
          description: El correo con el que se hizo la reserva.
          examples:
            - ana@ejemplo.test
    CanjeCodigo:
      type: object
      required:
        - destino
        - codigo
      properties:
        destino:
          type: string
          format: email
        codigo:
          type: string
          pattern: ^[0-9]{6}$
          description: |
            Los seis dígitos recibidos. Un solo uso y tres intentos (RF-12 A2):
            agotados, el código se quema y hay que pedir otro.
          examples:
            - '042317'
    TokenAcceso:
      type: object
      description: |
        Lo que se entrega al acertar el código.

        Es de vigencia corta y no se puede revocar: un invitado no tiene sesión que
        gestionar, así que la única defensa de este token es que caduque pronto. Por
        eso viaja `expira_en`: la interfaz puede pedir que se identifique otra vez
        ANTES de que falle una petición, en vez de después.
      required:
        - token
        - expira_en
      properties:
        token:
          type: string
          description: 'Se manda en la cabecera `Authorization: Bearer <token>`.'
        expira_en:
          type: string
          format: date-time
    Credenciales:
      type: object
      description: Inicio de sesión con contraseña (RF-12).
      required:
        - identificador
        - contrasena
      properties:
        identificador:
          type: string
          description: El correo de la cuenta.
        contrasena:
          type: string
          maxLength: 128
    ParTokens:
      type: object
      description: |
        Lo que entrega un inicio de sesión de cuenta: los dos tokens de RF-12.

        El de acceso va firmado y se verifica sin tocar la base, que es lo que le
        permite sostener la ruta de lectura; el de refresco se canjea contra
        `plataforma.sesion` y ahí sí se comprueba si la sesión fue revocada (RF-25).
        De esa asimetría sale una consecuencia que conviene tener presente:
        revocar corta el refresco al instante y el acceso al vencer.
      required:
        - acceso
        - expira_en
        - refresco
        - refresco_expira_en
      properties:
        acceso:
          type: string
          description: 'Se manda en la cabecera `Authorization: Bearer <token>`.'
        expira_en:
          type: string
          format: date-time
        refresco:
          type: string
          description: |
            Se guarda y no se manda en cada petición. Rota en cada canje: el valor
            entregado deja de valer en cuanto se usa, de modo que si alguien lo
            copió, el primero de los dos en canjearlo deja al otro fuera y el robo
            se nota.
        refresco_expira_en:
          type: string
          format: date-time
    SolicitudEnlace:
      type: object
      description: |
        Magic link de RF-12: un enlace de un solo uso, quince minutos de vigencia.

        Responde igual exista o no la cuenta (RF-12 A12).
      required:
        - destino
      properties:
        destino:
          type: string
          format: email
    CanjeEnlace:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: El valor que viaja en el enlace recibido por correo.
    SolicitudRefresco:
      type: object
      required:
        - refresco
      properties:
        refresco:
          type: string
    Sesion:
      type: object
      description: Una sesión activa, tal como la lista RF-25.
      required:
        - id
        - ultimo_acceso
        - creada_en
        - expira_en
        - actual
      properties:
        id:
          type: string
          format: uuid
        dispositivo:
          type: string
        ip:
          type: string
        ultimo_acceso:
          type: string
          format: date-time
        creada_en:
          type: string
          format: date-time
        expira_en:
          type: string
          format: date-time
        actual:
          type: boolean
          description: |
            Si es la sesión desde la que se está mirando. Sin esto, "cerrar sesión
            en el otro dispositivo" obliga a adivinar cuál de las dos filas es la
            propia.
    ListaSesiones:
      type: object
      required:
        - datos
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Sesion'
    NuevaCuenta:
      type: object
      description: |
        Registro de RF-24.

        Responde `202` exista o no ya ese correo, y nunca dice cuál de los dos casos
        fue (RF-24, y el mismo criterio de RF-12 A12). Distinguirlos convertiría el
        formulario de alta en un comprobador de direcciones registradas.
      required:
        - nombre
        - contrasena
        - acepta_terminos
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
        telefono:
          type: string
          pattern: ^\+[1-9][0-9]{7,14}$
          description: E.164. Se guarda normalizado; el formato para mostrar es del cliente.
        contrasena:
          type: string
          minLength: 12
          maxLength: 128
          description: |
            La política de seguridad la comprueba el servidor y devuelve un `422`
            con el motivo por campo si no se cumple. La longitud mínima está aquí
            además de allí para que el cliente pueda avisar antes de enviar.
        acepta_terminos:
          type: boolean
          description: |
            RF-24 lo exige explícitamente. Un `false` es un `422`, no un `400`: la
            petición está bien formada, lo que falta es un requisito del negocio.
    TipoCuenta:
      type: string
      description: |
        Los tres de RF-23. NO se asigna: `administrador` se deriva de ser dueño de
        un tenant (RF-35) y `super_admin` es el operador de la plataforma. Una
        cuenta que se registra por la vía normal es siempre `usuario`.
      enum:
        - usuario
        - administrador
        - super_admin
    EstadoCuenta:
      type: string
      enum:
        - pendiente_verificacion
        - activa
        - suspendida
        - eliminada
    Cuenta:
      type: object
      description: El perfil de RF-22, tal como lo ve su propio dueño.
      required:
        - id
        - tipo
        - estado
        - email_verificado
        - telefono_verificado
        - creada_en
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        email:
          type: string
          format: email
        telefono:
          type: string
        email_verificado:
          type: boolean
        telefono_verificado:
          type: boolean
        tipo:
          $ref: '#/components/schemas/TipoCuenta'
        tenant_id:
          type: string
          format: uuid
          description: |
            Solo en un `administrador`, y significa "administra este negocio", NO
            "reserva en él". Un `usuario` no lo lleva aunque tenga reservas en
            veinte tenants distintos.
        estado:
          $ref: '#/components/schemas/EstadoCuenta'
        creada_en:
          type: string
          format: date-time
    ActualizacionCuenta:
      type: object
      description: |
        RF-22. Todo opcional: se envía lo que cambia.

        Cambiar el correo o el teléfono lo marca como NO verificado y dispara la
        verificación de RF-19. Es lo que impide que apuntar la cuenta a una
        dirección ajena baste para recibir los avisos de otra persona.
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
        telefono:
          type: string
          pattern: ^\+[1-9][0-9]{7,14}$
    CanalNotificacion:
      type: string
      description: |
        Los tres canales de RF-21. Es una lista más larga que `CanalContacto` a
        propósito: un push sirve para avisar, no para transportar un código de un
        solo uso.
      enum:
        - email
        - sms
        - push
    Preferencia:
      type: object
      description: |
        Una fila de RF-21: este canal, para este tipo de aviso, habilitado o no.

        Lo que no aparece en la lista NO está deshabilitado: está en el valor por
        defecto del producto. Es la diferencia que permite que activar un tipo nuevo
        alcance a quien nunca tocó esta pantalla.
      required:
        - canal
        - tipo
        - habilitado
      properties:
        canal:
          $ref: '#/components/schemas/CanalNotificacion'
        tipo:
          type: string
          minLength: 1
          maxLength: 64
          examples:
            - recordatorio
        habilitado:
          type: boolean
    ListaPreferencias:
      type: object
      required:
        - datos
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Preferencia'
    CanalContacto:
      type: string
      description: Por dónde viaja un código o un enlace de un solo uso.
      enum:
        - email
        - sms
    SolicitudVerificacion:
      type: object
      description: RF-19. Reenvía la verificación del contacto indicado.
      required:
        - canal
      properties:
        canal:
          $ref: '#/components/schemas/CanalContacto'
    CanjeVerificacion:
      type: object
      description: |
        RF-19. Un solo valor para los dos canales: el enlace del correo trae un
        token largo y el SMS trae seis dígitos, pero desde aquí ambos son "lo que
        llegó al canal", y separarlos en dos campos obligaría a decidir cuál de los
        dos se está usando en una petición que ya lo dice por el valor.
      required:
        - valor
      properties:
        valor:
          type: string
    CambioContrasena:
      type: object
      description: |
        El camino de RF-18 para quien ya entró: la prueba de identidad es la
        contraseña actual, y se exige aunque haya sesión. Un token robado no debe
        bastar para quedarse con la cuenta cambiando su contraseña.

        Se invalidan las demás sesiones, no la que hace el cambio: aquí quien lo
        pide ya demostró saber la contraseña anterior, así que echarlo de su propia
        sesión sería castigar el gesto correcto.
      required:
        - contrasena_actual
        - contrasena_nueva
      properties:
        contrasena_actual:
          type: string
          maxLength: 128
        contrasena_nueva:
          type: string
          minLength: 12
          maxLength: 128
    Restablecimiento:
      type: object
      description: |
        El camino de RF-18 para quien NO puede entrar: la prueba de identidad es el
        enlace que recibió por correo.

        Se invalidan todas las sesiones activas (RF-18). Una contraseña se
        restablece justamente cuando se sospecha que alguien más la tiene, y dejar
        vivas las sesiones abiertas con la anterior vaciaría el gesto.
      required:
        - token
        - contrasena_nueva
      properties:
        token:
          type: string
          description: El valor que viaja en el enlace de recuperación.
        contrasena_nueva:
          type: string
          minLength: 12
          maxLength: 128
    SolicitudRecuperacion:
      type: object
      description: |
        RF-18. Responde igual exista o no la cuenta y no envía nada si no existe.
      required:
        - destino
      properties:
        destino:
          type: string
          format: email
    AccionAgente:
      type: string
      description: |
        Las acciones que un token de agente puede autorizar. Es un enum cerrado y no
        texto libre: el alcance de RF-13 se calcula intersecando esta lista con la
        de la cuenta impersonada, y una acción que nadie sabe interpretar no se
        puede intersecar con nada, solo aceptar de más.
      enum:
        - reservar
        - listar_reservas
        - cancelar_reserva
    IntercambioAgente:
      type: object
      description: |
        El intercambio de RF-13: credencial del agente + cuenta sobre la que quiere
        actuar + acciones que pide.

        Las tres condiciones se comprueban por separado y las tres devuelven lo
        mismo (`403`): que el agente exista y esté activo, que esa cuenta lo haya
        autorizado (RNF-07) y que las acciones estén dentro del alcance de esa
        cuenta (RF-23). Distinguirlas en la respuesta le diría a quien prueba
        credenciales qué parte acertó.
      required:
        - credencial
        - cuenta_id
        - acciones
      properties:
        credencial:
          type: string
          minLength: 32
          maxLength: 256
        cuenta_id:
          type: string
          format: uuid
          description: La cuenta en cuyo nombre se va a actuar.
        acciones:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AccionAgente'
    TokenAgente:
      type: object
      description: |
        El token de validación de RF-13: vigencia corta y un solo propósito.

        Devuelve el alcance CONCEDIDO, que puede ser menor que el pedido. Es
        información que el agente necesita: sin ella, la única forma de descubrir
        que una acción quedó fuera es intentarla y recibir un rechazo delante de la
        persona a la que está atendiendo.
      required:
        - token
        - expira_en
        - alcance
      properties:
        token:
          type: string
        expira_en:
          type: string
          format: date-time
        alcance:
          type: array
          items:
            $ref: '#/components/schemas/AccionAgente'
        cuenta_impersonada_id:
          type: string
          format: uuid
    NuevaSede:
      type: object
      required:
        - nombre
        - zona_horaria
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 200
        zona_horaria:
          type: string
          description: |
            Identificador IANA. El motor lo valida contra su propia base de zonas:
            un `America/Bogata` mal escrito no falla al guardarse, falla semanas
            más tarde dentro del cálculo de disponibilidad, que es el peor sitio
            posible para enterarse.
          examples:
            - America/Bogota
        direccion:
          type: string
          maxLength: 500
    ActualizacionSede:
      type: object
      description: |
        Todo opcional: se envía lo que cambia.

        Desactivar una sede NO cancela sus reservas. Deja de poder elegirse para
        reservas nuevas y nada más: lo ya vendido sigue en pie, y cancelarlo es una
        decisión aparte que RF-32 hace explícita.
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 200
        zona_horaria:
          type: string
        direccion:
          type: string
          maxLength: 500
        estado:
          $ref: '#/components/schemas/EstadoCatalogo'
    NuevoServicio:
      type: object
      required:
        - sede_id
        - nombre
        - duracion_min
        - precio_monto
      properties:
        sede_id:
          type: string
          format: uuid
        nombre:
          type: string
          minLength: 1
          maxLength: 200
        descripcion:
          type: string
          maxLength: 2000
        duracion_min:
          type: integer
          minimum: 1
          maximum: 1440
          description: |
            Es también la duración exacta de cada reserva: el núcleo rechaza un
            período que no coincida. Cambiarla no altera las reservas ya hechas.
        precio_monto:
          type: string
          pattern: ^\d+(\.\d{1,2})?$
          description: |
            Cadena decimal, no número: en JSON los números son de coma flotante y
            80000.10 no se representa exactamente. La moneda no se envía —es del
            tenant (RF-38)— y la reserva congela ambas al crearse (RF-31).
    ActualizacionServicio:
      type: object
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 200
        descripcion:
          type: string
          maxLength: 2000
        duracion_min:
          type: integer
          minimum: 1
          maximum: 1440
        precio_monto:
          type: string
          pattern: ^\d+(\.\d{1,2})?$
        estado:
          $ref: '#/components/schemas/EstadoCatalogo'
    Recurso:
      type: object
      description: |
        Lo que de verdad se reserva: la sala, la silla, el equipo, la persona. La
        invariante de no solapamiento es sobre un RECURSO, no sobre un servicio.
      required:
        - id
        - sede_id
        - nombre
        - estado
      properties:
        id:
          type: string
          format: uuid
        sede_id:
          type: string
          format: uuid
        nombre:
          type: string
        estado:
          $ref: '#/components/schemas/EstadoCatalogo'
        servicios:
          type: array
          description: Servicios que este recurso presta (RF-30).
          items:
            type: string
            format: uuid
    ListaRecursos:
      type: object
      required:
        - datos
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Recurso'
    NuevoRecurso:
      type: object
      required:
        - sede_id
        - nombre
      properties:
        sede_id:
          type: string
          format: uuid
        nombre:
          type: string
          minLength: 1
          maxLength: 200
        servicios:
          type: array
          description: |
            Qué servicios presta. Sin al menos uno, el recurso existe pero no es
            reservable: el núcleo comprueba que el par servicio/recurso esté
            declarado antes de insertar.
          items:
            type: string
            format: uuid
    ActualizacionRecurso:
      type: object
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 200
        estado:
          $ref: '#/components/schemas/EstadoCatalogo'
        servicios:
          type: array
          description: Reemplaza la lista completa, no la amplía.
          items:
            type: string
            format: uuid
    ReglaDisponibilidad:
      type: object
      description: |
        Un tramo semanal recurrente de un recurso (RF-14).

        Las horas van SIN zona porque hablan del reloj de pared del negocio: "los
        lunes de 9 a 17" significa las 9 de la sede, no las 9 UTC. La zona la pone
        la sede, y por eso la regla no cambia cuando cambia el horario de verano.
      required:
        - id
        - recurso_id
        - dia_semana
        - hora_inicio
        - hora_fin
      properties:
        id:
          type: string
          format: uuid
        recurso_id:
          type: string
          format: uuid
        dia_semana:
          type: integer
          minimum: 0
          maximum: 6
          description: 0 = domingo, como `extract(dow)` de PostgreSQL.
        hora_inicio:
          type: string
          examples:
            - '09:00'
        hora_fin:
          type: string
          examples:
            - '17:00'
          description: |
            Tiene que ser mayor que `hora_inicio`: una regla no cruza medianoche.
            Un turno de noche son DOS reglas, una por cada día que toca, y esa es la
            única forma en que el cálculo de disponibilidad puede resolverlo sin
            ambigüedad.
        vigente_desde:
          type: string
          format: date
        vigente_hasta:
          type: string
          format: date
    ListaReglas:
      type: object
      required:
        - datos
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/ReglaDisponibilidad'
    NuevaRegla:
      type: object
      required:
        - recurso_id
        - dia_semana
        - hora_inicio
        - hora_fin
      properties:
        recurso_id:
          type: string
          format: uuid
        dia_semana:
          type: integer
          minimum: 0
          maximum: 6
        hora_inicio:
          type: string
          examples:
            - '09:00'
        hora_fin:
          type: string
          examples:
            - '17:00'
        vigente_desde:
          type: string
          format: date
        vigente_hasta:
          type: string
          format: date
    TipoExcepcion:
      type: string
      enum:
        - feriado
        - mantenimiento
        - cierre
    ExcepcionCalendario:
      type: object
      description: |
        Un hueco que tapa la disponibilidad (RF-14). Es de una sede o de un recurso,
        nunca de los dos ni de ninguno.
      required:
        - id
        - periodo
        - tipo
      properties:
        id:
          type: string
          format: uuid
        sede_id:
          type: string
          format: uuid
        recurso_id:
          type: string
          format: uuid
        periodo:
          $ref: '#/components/schemas/Periodo'
        tipo:
          $ref: '#/components/schemas/TipoExcepcion'
        motivo:
          type: string
    ListaExcepciones:
      type: object
      required:
        - datos
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/ExcepcionCalendario'
    NuevaExcepcion:
      type: object
      description: |
        Exactamente uno de `sede_id` o `recurso_id`. Ninguno de los dos deja una
        excepción que no tapa nada; los dos a la vez, una que no se sabe si tapa la
        sede entera o solo ese recurso.
      required:
        - periodo
        - tipo
      properties:
        sede_id:
          type: string
          format: uuid
        recurso_id:
          type: string
          format: uuid
        periodo:
          $ref: '#/components/schemas/Periodo'
        tipo:
          $ref: '#/components/schemas/TipoExcepcion'
        motivo:
          type: string
          maxLength: 500
    Politica:
      type: object
      description: |
        Una versión publicada de la política de cancelación y modificación (RF-15).

        Es INMUTABLE: no se edita ni se borra. Publicar condiciones nuevas es
        publicar una versión nueva, y las reservas existentes siguen apuntando a la
        que congelaron al crearse. Es lo que impide que un negocio endurezca su
        política el martes y se la aplique a quien reservó el lunes.
      required:
        - id
        - version
        - rango_cancelacion_horas
        - rango_modificacion_horas
        - vigente_desde
      properties:
        id:
          type: string
          format: uuid
        servicio_id:
          type: string
          format: uuid
          description: Ausente = política por defecto del tenant.
        version:
          type: integer
          minimum: 1
        rango_cancelacion_horas:
          type: integer
          minimum: 0
        rango_modificacion_horas:
          type: integer
          minimum: 0
        penalidad_pct:
          type: string
          pattern: ^\d+(\.\d{1,2})?$
        vigente_desde:
          type: string
          format: date-time
        creada_en:
          type: string
          format: date-time
    ListaPoliticas:
      type: object
      required:
        - datos
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Politica'
    NuevaPolitica:
      type: object
      description: |
        El número de versión NO se envía: lo asigna el servidor como el siguiente
        del mismo ámbito. Dejarlo al cliente permitiría publicar una versión 3
        después de una 7 y romper el orden del que depende "cuál está vigente".
      required:
        - rango_cancelacion_horas
        - rango_modificacion_horas
      properties:
        servicio_id:
          type: string
          format: uuid
        rango_cancelacion_horas:
          type: integer
          minimum: 0
          maximum: 8760
        rango_modificacion_horas:
          type: integer
          minimum: 0
          maximum: 8760
        penalidad_pct:
          type: string
          pattern: ^\d+(\.\d{1,2})?$
        vigente_desde:
          type: string
          format: date-time
          description: Ausente = ahora. Sirve para publicar con antelación.
    Voucher:
      type: object
      description: |
        Un descuento porcentual (RF-17). Solo porcentaje, nunca monto fijo: es una
        restricción de alcance del producto y vive en un CHECK para que no se filtre
        por accidente.
      required:
        - id
        - codigo
        - porcentaje
        - usos_actuales
        - estado
        - creado_en
      properties:
        id:
          type: string
          format: uuid
        codigo:
          type: string
        porcentaje:
          type: string
          pattern: ^\d+(\.\d{1,2})?$
        limite_usos:
          type: integer
          minimum: 1
        usos_actuales:
          type: integer
        caduca_en:
          type: string
          format: date-time
        estado:
          type: string
          enum:
            - activo
            - eliminado
        creado_en:
          type: string
          format: date-time
    ListaVouchers:
      type: object
      required:
        - datos
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Voucher'
    NuevoVoucher:
      type: object
      description: |
        Hace falta un límite de usos o una caducidad, al menos uno. Un voucher del
        50% sin ninguno de los dos es una fuga de ingresos abierta para siempre, y
        el motor lo rechaza.

        No hay operación de edición, y no es un olvido: RF-17 permite crear o
        eliminar y nada más. Cambiarle las condiciones a un voucher que ya está
        circulando es cambiárselas a quien ya lo recibió.
      required:
        - codigo
        - porcentaje
      properties:
        codigo:
          type: string
          minLength: 3
          maxLength: 64
        porcentaje:
          type: string
          pattern: ^\d+(\.\d{1,2})?$
          description: Mayor que 0 y hasta 100.
        limite_usos:
          type: integer
          minimum: 1
        caduca_en:
          type: string
          format: date-time
    TipoTarifa:
      type: string
      enum:
        - franja_horaria
        - dia_semana
        - temporada
    Tarifa:
      type: object
      description: |
        Sobrescribe el precio del servicio cuando su condición aplica (RF-31). El
        precio base sigue viviendo en el servicio; esto existe aparte porque sí es
        uno a muchos.
      required:
        - id
        - servicio_id
        - tipo
        - condicion
        - monto
        - prioridad
      properties:
        id:
          type: string
          format: uuid
        servicio_id:
          type: string
          format: uuid
        tipo:
          $ref: '#/components/schemas/TipoTarifa'
        condicion:
          type: object
          description: |
            Su forma depende del tipo: una franja lleva horas, un día de semana un
            número, una temporada dos fechas. Sin esquema fijo porque el motor no la
            evalúa, la interpreta quien calcula el precio.
          additionalProperties: true
        monto:
          type: string
          pattern: ^\d+(\.\d{1,2})?$
        prioridad:
          type: integer
          description: |
            Con dos tarifas que aplican a la vez gana la de prioridad más alta. Sin
            este campo el resultado dependería del orden de las filas, que no es un
            orden.
    ListaTarifas:
      type: object
      required:
        - datos
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Tarifa'
    NuevaTarifa:
      type: object
      required:
        - servicio_id
        - tipo
        - condicion
        - monto
      properties:
        servicio_id:
          type: string
          format: uuid
        tipo:
          $ref: '#/components/schemas/TipoTarifa'
        condicion:
          type: object
          additionalProperties: true
        monto:
          type: string
          pattern: ^\d+(\.\d{1,2})?$
        prioridad:
          type: integer
          default: 0
    ResultadoAuditoria:
      type: string
      enum:
        - exito
        - rechazo
    EventoAuditoria:
      type: object
      description: |
        Una acción registrada (RF-36). Append-only: los eventos no se modifican ni
        se eliminan.
      required:
        - id
        - ocurrido_en
        - actor_tipo
        - accion
        - recurso_tipo
        - resultado
      properties:
        id:
          type: string
          format: uuid
        ocurrido_en:
          type: string
          format: date-time
        actor_tipo:
          type: string
          enum:
            - usuario
            - administrador
            - agente
            - sistema
            - super_admin
        actor_id:
          type: string
          format: uuid
        agente_id:
          type: string
          format: uuid
          description: Presente solo cuando la ejecutó un agente en nombre de otra cuenta.
        cuenta_impersonada_id:
          type: string
          format: uuid
        alcance_token:
          type: array
          description: El alcance con el que actuó el agente (RF-13).
          items:
            type: string
        accion:
          type: string
          examples:
            - crear_sede
        recurso_tipo:
          type: string
          examples:
            - sede
        recurso_id:
          type: string
          format: uuid
        resultado:
          $ref: '#/components/schemas/ResultadoAuditoria'
        ip:
          type: string
        dispositivo:
          type: string
    ListaAuditoria:
      type: object
      required:
        - datos
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/EventoAuditoria'
        siguiente_cursor:
          type: string
          description: Ausente cuando no hay más páginas.
    EstadoReserva:
      type: string
      description: Estados de RF-28.
      enum:
        - pendiente
        - confirmada
        - en_curso
        - completada
        - cancelada
        - no_show
        - expirada
    Contacto:
      type: object
      required:
        - nombre
        - email
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
        telefono:
          type: string
    Reserva:
      type: object
      required:
        - id
        - servicio_id
        - recurso_id
        - periodo
        - estado
        - precio_cobrado
        - creada_en
      properties:
        id:
          type: string
          format: uuid
        servicio_id:
          type: string
          format: uuid
        recurso_id:
          type: string
          format: uuid
        periodo:
          $ref: '#/components/schemas/Periodo'
        estado:
          $ref: '#/components/schemas/EstadoReserva'
        precio_cobrado:
          $ref: '#/components/schemas/Dinero'
        contacto:
          $ref: '#/components/schemas/Contacto'
        expira_en:
          type: string
          format: date-time
          description: |
            Solo mientras el estado es `pendiente`. Pasado ese instante el cupo
            puede liberarse (RF-27).
        creada_en:
          type: string
          format: date-time
    ListaReservas:
      type: object
      required:
        - datos
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Reserva'
        siguiente_cursor:
          type: string
          description: Ausente cuando no hay más páginas.
    NuevaReserva:
      type: object
      required:
        - servicio_id
        - recurso_id
        - periodo
        - contacto
      properties:
        servicio_id:
          type: string
          format: uuid
        recurso_id:
          type: string
          format: uuid
        periodo:
          $ref: '#/components/schemas/Periodo'
        contacto:
          $ref: '#/components/schemas/Contacto'
        voucher_codigo:
          type: string
          description: Código de descuento, si aplica (RF-08).
    ReservaCreada:
      type: object
      description: |
        Lo que devuelve la ruta crítica: la reserva ya con el cupo garantizado, más
        el secreto que el cliente necesita para confirmar el pago contra Stripe
        directamente, sin que el importe pase por este backend.
      required:
        - reserva
      properties:
        reserva:
          $ref: '#/components/schemas/Reserva'
        pago_client_secret:
          type: string
          description: '`client_secret` del PaymentIntent de Stripe.'
    ModificacionReserva:
      type: object
      description: |
        Reprogramar una reserva (RF-07): moverla de hora, y opcionalmente de
        recurso.

        Es la MISMA reserva, no una nueva. Cancelar y volver a reservar tiene dos
        problemas que esto no tiene: entre las dos operaciones el cupo queda libre y
        otro puede llevárselo, y la reserva pierde su historia, su precio congelado
        y su política. Aquí el cupo viejo se libera y el nuevo se toma en la misma
        transacción, así que no hay instante en el que la persona no tenga nada.

        El precio NO se recalcula. Se congeló al crear (RF-31) y mover la hora no lo
        descongela: cobrar más por reprogramar sería una decisión de negocio que
        nadie ha tomado, y hacerlo en silencio sería peor.
      required:
        - periodo
      properties:
        periodo:
          $ref: '#/components/schemas/Periodo'
        recurso_id:
          type: string
          format: uuid
          description: |
            Ausente = se queda en el mismo recurso. El nuevo tiene que prestar el
            mismo servicio: cambiar de servicio cambiaría el precio y la duración,
            y eso ya no es reprogramar.
    CambioEstado:
      type: object
      description: |
        Una transición manual de RF-28, de las que la agenda del administrador
        dispara (RF-32).

        Solo tres, y son las que la leyenda de RF-28 asigna a una persona:
        `confirmada → en_curso` es el check-in, `confirmada → no_show` es la
        ausencia registrada a mano antes de que el umbral la marque sola, y
        `en_curso → completada` cierra la cita. Cancelar tiene ruta propia porque
        libera cupo y aplica una política; las automáticas las hace el trabajador.
      required:
        - estado
      properties:
        estado:
          $ref: '#/components/schemas/EstadoReserva'
        motivo:
          type: string
          maxLength: 500
          description: Queda en el historial de la reserva, que el cliente puede ver.
    NuevaCalificacion:
      type: object
      description: |
        RF-20. Una por reserva, y solo sobre una reserva completada: calificar algo
        que todavía no ocurrió no es una opinión, es una expectativa.
      required:
        - puntaje
      properties:
        puntaje:
          type: integer
          minimum: 1
          maximum: 5
        comentario:
          type: string
          maxLength: 2000
    Calificacion:
      type: object
      required:
        - id
        - reserva_id
        - puntaje
        - creada_en
      properties:
        id:
          type: string
          format: uuid
        reserva_id:
          type: string
          format: uuid
        puntaje:
          type: integer
        comentario:
          type: string
        creada_en:
          type: string
          format: date-time
  responses:
    PeticionInvalida:
      description: La petición está mal formada
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    ErrorInterno:
      description: Error no previsto
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    NoEncontrado:
      description: |
        No existe. Bajo RLS, "no existe" y "existe pero es de otro tenant" son
        indistinguibles, y así debe ser: distinguirlos filtraría la existencia de
        datos ajenos.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    DemasiadasPeticiones:
      description: Se superó la cuota de la cuenta o del agente (RNF-08)
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    NoAutorizado:
      description: |
        Falta el token de acceso, o ya no vale. No distingue entre "no lo mandaste"
        y "el que mandaste está mal": para quien prueba tokens, saber cuál de las
        dos cosas falló es la mitad del trabajo hecho.

        El vencimiento SÍ se distingue en el `type` del problema, y no es una
        contradicción: caducar no es un fallo de quien lo presenta, es el
        funcionamiento normal, y la interfaz tiene que poder decir "vuelve a
        identificarte" en vez de "no eres tú".
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    NoProcesable:
      description: Sintácticamente válida pero viola una regla de negocio
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    FueraDeAlcance:
      description: |
        La identificación es válida pero el recurso queda fuera del alcance de esa
        cuenta (RF-23).

        Se distingue del 401 a propósito: un 401 dice "no sé quién eres" y la
        interfaz responde pidiendo identificarse otra vez, cosa que aquí no
        arreglaría nada. Y no sustituye al 404 de un recurso ajeno: cuando decir
        "existe pero no es tuyo" ya filtra la existencia del recurso, la respuesta
        correcta sigue siendo 404. Este 403 es para las acciones cuyo alcance no
        depende de un identificador que haya que adivinar.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
