;; PgBouncer para desarrollo local.
;;
;; La configuracion esta en un archivo y no en variables de entorno a
;; proposito: pool_mode es la razon de que este servicio exista en la
;; composicion, y tiene que poder leerse.

[databases]
reservas = host=postgres port=5432 dbname=reservas

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

;; La linea que importa. En modo transaccion la conexion de servidor vuelve al
;; pool en cada COMMIT y la toma otro cliente, lo que impone dos cosas al
;; codigo Go (ver backend/internal/datos/doc.go):
;;
;;   1. El contexto de tenant debe fijarse con set_config(..., true) -- SET
;;      LOCAL --, porque un SET de sesion sobreviviria al cambio de cliente y
;;      filtraria el tenant al siguiente.
;;   2. pgx no puede cachear prepared statements por conexion.
;;
;; Es la restriccion que ARQ-01 y ARQ-03 dan por sentada, y por eso el entorno
;; local la reproduce en vez de dejarla para produccion.
pool_mode = transaction

;; pgx envia parametros de arranque que PgBouncer no sabe reenviar en modo
;; transaccion. Sin esta linea la conexion falla nada mas abrirse.
ignore_startup_parameters = extra_float_digits,options,search_path

max_client_conn = 500
default_pool_size = 25
min_pool_size = 5

admin_users = postgres
stats_users = postgres

log_connections = 0
log_disconnections = 0
